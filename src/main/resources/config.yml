settings:
  example_option: true

# Verbose logging for troubleshooting. When true, Backrooms writes extra "[debug]" lines (per-level
# loading, dimension-type swaps, ...) to logs/latest.log. Also toggled live with /backrooms debug on|off,
# which saves the setting here.
debug: false

backrooms:
  # Entry triggers (overworld -> backrooms)
  entry:
    enabled_worlds:
      - world
      - world_nether
    suffocation_noclip:
      enabled: true
      damage_threshold: 16.0
      target_level: level_0
    void_fall:
      enabled: true
      target_level: level_0
    bed_anomaly:
      enabled: true
      chance: 0.05
      require_thunderstorm: true
      target_level: level_64637
    aether_portal:
      enabled: true
      target_level: level_94
    herobrine_shrine:
      enabled: true
      target_level: level_0
    twilight_portal:
      enabled: true
      target_level: level_84
    tea_kettle:
      enabled: true
      target_level: level_418

  # Scan levels: 1881 (Hintze Hall), 1967 and 1973 (the Southbank Undercroft) and 9500 (Göbekli
  # Tepe) are 16x-scale voxelizations of 3D scans. Their meshes (~32 MB in total) aren't in the jar:
  # on first start they're downloaded from base_url into plugins/Backrooms/meshes/ and checked
  # against built-in checksums. The worlds built from them are huge and can grow to several hundred
  # MB each as players explore. Set download: false to skip the downloads; these levels are then
  # disabled (unless their meshes are already in meshes/), and exits to them close or lead elsewhere.
  scan_levels:
    download: true
    base_url: "https://def9a2a4.github.io/backrooms/meshes/"

  # Entity spawner settings
  entity_spawner:
    max_entities_per_player: 3
    spawn_check_interval_ticks: 100
    spawn_distance_min: 30
    spawn_distance_max: 60

  # Player settings
  player:
    escalation_thresholds_minutes:
      - 5
      - 15
      - 30
      - 60
      - 120
