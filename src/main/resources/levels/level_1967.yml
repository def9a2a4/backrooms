id: level_1967
display_name: "The Undercroft"
generator: scan
environment: NETHER
dimension_type: dark
biome: "backrooms:undercroft"
spawn_radius: 0
enter_message: "§8§oConcrete under a concert hall. Nobody planned for anyone to be here."

# The Southbank Centre's undercroft (London, built 1967) at 16x, voxelized from a 3D scan that's
# downloaded on first start (config.yml scan_levels), all in greys and in the dark. Put any light
# down and someone notices: Level 1973, the same place after the skaters found it.
generator_config:
  mesh: undercroft_grey
  mode: shell
  scale: 16
  ground_y: 37
  thickness: 1.5
  spawn: {x: 177, y: 67, z: -34}
  props:
    - {type: block, x: 184, y: 67, z: -40, block: "candle[lit=true,candles=3]"}
    - {type: block, x: 168, y: 67, z: -24, block: "candle[lit=true]"}

events:
  - ambient_sound

event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 6
    chance: 0.35
    sounds:
      - ambient.cave
      - block.pointed_dripstone.drip_water
      - ambient.underwater.loop.additions

exit_triggers:
  - type: place_block
    materials: [torch, wall_torch, soul_torch, soul_wall_torch, lantern, soul_lantern, glowstone,
                sea_lantern, shroomlight, jack_o_lantern, campfire, soul_campfire, end_rod,
                ochre_froglight, verdant_froglight, pearlescent_froglight, redstone_lamp,
                copper_bulb, "#minecraft:candles"]
    target_level: level_1973
    keep_position: true          # same scan, same place: you stay where you are and the lights come on
    transition:
      blindness_ticks: 60
      delay_ticks: 20
      message: "§eSomeone saw your light. Then someone else."
  - type: below_y
    y_threshold: 2
    target_level: level_1967
    transition:
      blindness_ticks: 40
      delay_ticks: 10
      message: "§8§oThe concrete catches you."
