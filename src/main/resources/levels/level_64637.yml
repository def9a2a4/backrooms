id: level_64637
display_name: "The Library"
generator: level_64637
environment: NETHER
dimension_type: library
biome: "backrooms:library"
fixed_time: 18000
enter_message: "§8§kxxxx§r §7You find yourself among infinite shelves. §8§kxxxx"

events:
  - ambient_sound
  - footstep_echo

entities: []

event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 8
    chance: 0.2
    sounds:
      - ambient.cave
      - ambient.warped_forest.mood
  footstep_echo:
    enabled: true
    check_interval_seconds: 3
    chance: 0.5
    delay_ticks: 12
    offset_blocks: 8
exit_triggers:
  - type: collect_items
    target_level: overworld
    item: WRITTEN_BOOK
    threshold: 16
    warning_threshold: 12
    warning_message: "§7§osomewhere, the index updates its count."
    transition:
      blindness_ticks: 80
      delay_ticks: 30
  - type: fall_distance
    target_level: overworld
    fall_distance: 200
    transition:
      blindness_ticks: 80
      darkness_ticks: 80
      delay_ticks: 40
      message: "§7The stairs end. You feel yourself falling... and then, light."
  - type: open_book
    target_level: level_101
    book_title: "level.dat"
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§7Opening level.dat ... §8last played: a long time ago"
  # Entry books (levels/level_64637_books.yml `entry_books`): the archive
  # contains the old worlds. Books ask; terminals execute.
  - type: open_book
    target_level: level_4
    book_title: "Walking Log"
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§7You keep walking."
  - type: open_book
    target_level: level_94
    book_title: "Rules and Challenges"
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§7Challenge accepted."
  - type: open_book
    target_level: level_974
    book_title: "planetoids.jar"
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§7Generating... §8small worlds hang in the dark"
  - type: open_book
    target_level: level_84
    book_title: "Groundskeeper's Notes"
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§7You step inside. The hedge closes behind you."
  - type: open_book
    target_level: level_5
    book_title: "11"
    transition:
      blindness_ticks: 100
      darkness_ticks: 100
      delay_ticks: 30
      message: "§8playing the remaining 0:06"
  - type: open_book
    target_level: level_7
    book_title: "r.0.0.mca"
    transition:
      blindness_ticks: 100
      delay_ticks: 30
      message: "§8attempting recovery... §crecovery failed"
