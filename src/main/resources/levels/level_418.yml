id: level_418
display_name: "I'm a Teapot"
generator: level_418
environment: NORMAL
dimension_type: fullbright
biome: "backrooms:test_scene"
spawn_radius: 0
meshes: [teapot, suzanne, bunny, dragon, lucy]   # the test models, downloaded (config.yml meshes)
enter_title: "§c418"
enter_subtitle: "§7I'm a teapot"
enter_message: "§c[ERR] §7Block engine not found. Falling back to voxel renderer."

# A voxel engine's test scene: Utah teapots, Suzanne, the Stanford bunny / dragon / Lucy, primitives
# and Cornell boxes on an endless checkerboard, all in flat concrete, upright or tumbled in 3D and
# never touching the floor. Meshes are downloaded (config.yml meshes) and voxelized at runtime
# (scripts/testscene/build_meshes.py). Each 384-block region is a quadtree whose leaves (48 to 384
# blocks) each hold one thing sized to fill it; leaves get bigger further from spawn.
# Every region holds one small stone cube with a single oak log on top: the only real Minecraft in
# the level. Breaking any wood leaves.
generator_config:
  floor_y: 8
  empty_chance: 0.3       # chance a 48-block leaf is empty (a third of that for bigger leaves)
  cornell_chance: 0.08    # chance a 48- or 96-block leaf is a Cornell box
  far_distance: 2500      # blocks from spawn at which leaves reach their largest typical size

events:
  - ambient_sound

event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 8
    chance: 0.3
    sounds:
      - block.beacon.ambient
      - ui.button.click
      - block.note_block.hat

exit_triggers:
  - type: break_block
    materials: ["#minecraft:logs"]
    target_level: level_94
    transition:
      blindness_ticks: 80
      delay_ticks: 30
      message: "§a[OK] §7Block engine restored. Loading world..."
