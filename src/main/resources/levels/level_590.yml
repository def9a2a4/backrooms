id: level_590
display_name: "The Sponge"
generator: level_590
environment: NETHER
dimension_type: fullbright
biome: "backrooms:sponge"
spawn_radius: 0
enter_message: "§e§oEverything here is full of holes. So are you."
generator_config:
  order: 5        # each tile is 3^order blocks on a side (3..5; 5 = 243 fits the 0..256 build height); tiles repeat forever in x/z
  base_y: 6
events: [ambient_sound]
event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 8
    chance: 0.3
    sounds: [block.pointed_dripstone.drip_water, block.sponge.absorb, ambient.cave]
exit_triggers:
  # Falling out the bottom returns you to spawn. The way out is a defect:
  # roughly one block in two thousand is wet. Break it.
  - type: below_y
    y_threshold: -20
    target_level: level_590
    transition:
      blindness_ticks: 40
      delay_ticks: 10
      message: "§7§oThe sponge soaks you back up."
  - type: break_block
    materials: ["WET_SPONGE"]
    target_level: level_3
    transition:
      blindness_ticks: 60
      delay_ticks: 20
      message: "§7The structure was dry by definition. This block did not agree."
