  - title: "seed.txt"
    author: "kept by someone"
    pages:
      - "§8-4172144997902289642\n\n§7That is the whole file. It was in a folder called KEEP, inside a folder called old, inside a folder called old.\n\n§7Someone typed it out by hand. There is a typo they corrected."
      - "§7The thing about a seed is that it remembers everything except you.\n\n§7Type it in and the same mountain rises. The same birch forest. The same little island off the coast where we put the lighthouse."
      - "§7But not the lighthouse.\n\n§7Not the bridge. Not the farm. Not the dog. Not the sign that said WELCOME HOME in wrong-case letters because Caleb couldn't find the shift key."
      - "§7I generate it sometimes, anyway. I stand on the island. I don't build anything. It feels rude to.\n\n§7It's his island. It's just empty now. The seed doesn't know that. I'm the only one who does."

