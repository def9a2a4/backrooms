# ─── Pre-Written Books ───
# Rare complete books with fixed title, author, and pages.
# These are the only fully coherent texts in the Library.
pre_written_chance: 0.02

pre_written_books:
  - title: "A Note from the Librarian"
    author: "The Librarian"
    pages:
      - "You are in the Library. It has many names in many languages, most of which have not been invented yet. You may call it whatever you wish. It will not answer to any of them."
      - "The Library contains every book that has been written, every book that will be written, and every book that could be written. Most of them are nonsense. A few are not. You will not be able to tell the difference."
      - "You may take any book from any shelf. You may not take any book from the Library. These are not contradictory statements. You will understand when you try to leave."
      - "The exit is on every floor. The exit is on no floor. Both of these are true. I am sorry that this is not more helpful."

  - title: "Borrower's Guide"
    author: "The Archivist"
    pages:
      - "Welcome to the Archive. Your borrower's card has been pre-assigned. You did not apply for it. The number on the card is the number of books you will read before you leave. Do not count them."
      - "Books may be returned to any shelf. The Library will re-sort them. The sorting algorithm is not known to us. It may not be an algorithm. It may be a preference."
      - "Overdue fines are assessed at a rate of one memory per day. The Library selects which memory. You will not notice it is gone until someone reminds you of something you no longer recall."
      - "If you find a book with your name as the author, do not read it. If you have already read it, do not read it again. If you have read it more than once, it is too late and we are sorry."

  - title: "Observations on Infinity"
    author: "No One"
    pages:
      - "I have walked the Library for what I believe to be several years. The floors repeat, but not exactly. Each repetition contains small differences — a shelf at a slightly different angle, a book with one additional page, a shadow where there was none."
      - "I have attempted to count the shelves on a single floor. I counted for three days. On the fourth day I discovered I was counting the same shelf repeatedly. Not because I had gone in a circle, but because the shelf had followed me."
      - "The books on the upper shelves are older. Not because they were placed there first, but because height is time in the Library. The ceiling is the past. The floor is the future. We stand in the present, which is the narrowest part."
      - "I found a book today that was blank when I opened it and full when I closed it. I opened it again and it was blank. I believe the book is only written while no one is reading it. This is, I think, the cruelest thing about the Library."

  - title: "Complaint (Filed)"
    author: "Unknown"
    pages:
      - "To Whom It May Concern:\n\nI am writing to formally complain about the organization of this Library. The decimal system is non-functional. The card catalogue references shelves that do not exist. The shelves that do exist are not where the catalogue says they are."
      - "Furthermore, several books I have requested are listed as 'checked out' to myself, despite the fact that I have never visited this Library before today. The dates on the borrower's cards predate my birth."
      - "I have also noted that the Library appears to have no staff, no hours of operation, no entrance, and no exit. The lights are on but there are no light fixtures. The temperature is comfortable but there is no ventilation."
      - "I expect a response within 30 business days. My return address is [this sentence goes on for the rest of the page in increasingly small handwriting that eventually becomes too small to read]"

  - title: "The Last Catalogue"
    author: "The Library Itself"
    pages:
      - "Entry 1: This book.\nEntry 2: Every other book.\nEntry 3: The book that contains entries 1 and 2.\nEntry 4: The book that is not contained in entry 3.\nEntry 5: [PARADOX — ENTRY REMOVED]"
      - "Entry 6: The book you are looking for.\nEntry 7: The book you will find instead.\nEntry 8: The book that describes the difference between entries 6 and 7.\nEntry 9: The book that explains why there is no difference."
      - "Entry 10: A complete list of all entries in this catalogue. This entry is larger than the catalogue. This is expected.\nEntry 11: A book of corrections to this catalogue. It is also incorrect."
      - "Entry 12: The final entry. The catalogue after this entry is empty. The Library after this entry is full. The relationship between the catalogue and the Library is: the catalogue is a room in the Library. The Library is a sentence in the catalogue."

  - title: "Exploration Log IV"
    author: "Dr. ████"
    pages:
      - "Subject: D-9035. Location: Stairwell discovered in aisle 7,042. Descending. Audio equipment nominal. Subject reports concrete walls, no railing, fluorescent lighting. Stairs descend at 38 degrees."
      - "Landing 1 (13 steps): Subject reports faint vocalizations from below. 'It sounds like a child. Maybe 200 meters down.' Instruments confirm audio source but cannot triangulate. Source distance remains constant."
      - "Landing 5: Subject breathing heavily. 'The walls are wet. The lights are dimmer. I can still hear the crying but it's not getting closer. I've been descending for twenty minutes.' Stairwell dimensions unchanged."
      - "Landing 12: 'There's a face on the landing below me. No — not a face. The suggestion of a face. No eyes, no mouth, just... the shape where a face should be. It's looking at me. It doesn't have eyes but it's looking at me.'"
      - "Landing 13: Contact lost. Audio recording recovered 6 days later on a shelf in aisle 7,042. Final 4 seconds of audio: 14 knocks, evenly spaced. The stairwell is no longer accessible. The shelf where the recording was found smells faintly of concrete."

  - title: "Staff Survival Guide"
    author: "M.E.G. Operative #3291"
    pages:
      - "If you are reading this, you have entered the Backrooms. You did not choose to come here. Nobody does. What matters now is that you survive. This guide was compiled from the accounts of 347 wanderers. 12 of them made it out."
      - "Level 0 — The Lobby: Yellow wallpaper. Damp carpet. Fluorescent hum at 277 Hz. ~600,000 sq. miles of empty office space. No entities confirmed, but do not trust movement in your peripheral vision. If something calls your name, it is not a person."
      - "Entities: The Skin-Stealer wears faces it has taken. Light repels it. The Hound hunts by sound. The Wretch was human once. If you see another wanderer, confirm they cast a shadow. If they do not, run. Do not run in a straight line."
      - "Almond Water: Found in bottles near supply caches. Drink it. It is the only safe consumable in the Backrooms. It tastes wrong. Drink it anyway. Dehydration kills faster than most entities."
      - "Exits: Exist, but do not behave like exits. They appear when you stop looking for them. The M.E.G. theorizes the Backrooms respond to intent. Want to leave, and the walls give you more to search. Stop wanting, and a door appears. This is not a metaphor. This is the best intel we have."

  - title: "Incident Report: The Old Man"
    author: "SCP Foundation"
    pages:
      - "Item #: SCP-64637-A. Object Class: Keter. Description: An elderly humanoid entity observed in the restricted stacks of Level 64637. Appearance suggests advanced decomposition. Entity leaves a corrosive residue on all surfaces it contacts."
      - "Behavior: SCP-64637-A phases through shelving units at will. It preferentially targets individuals who are actively reading. Pursuit is silent. Victims report a smell of rotting paper before visual contact."
      - "Containment: All attempts to restrict SCP-64637-A to a single aisle have failed. The entity consistently breaches at moments when observation is most difficult. Researchers suspect it is aware of camera placement."
      - "Addendum: On ██/██/████, SCP-64637-A was observed placing a book on a shelf. The book was recovered. It contained a detailed floor plan of the observation post. The floor plan was accurate. We have relocated."

  - title: "CHANGELOG"
    author: "HEROBRINE"
    pages:
      - "v0.0.0 — Added the void.\nv0.0.1 — Added light. Removed the void. The void is still there.\nv0.1.0 — Added the Library. The Library was already there.\nv0.2.0 — Added books. The books were already written."
      - "v0.3.0 — Added the exit. Removed the exit. Added the exit again. The exit does not work.\nv0.4.0 — Removed Herobrine.\nv0.4.1 — Removed Herobrine.\nv0.4.2 — Removed Herobrine.\nv0.5.0 — Stopped removing Herobrine. He was never added."
      - "v1.0.0 — Added players. Players cannot leave. This is not a bug.\nv1.0.1 — Added a staircase. The staircase goes down. There is no bottom.\nv1.1.0 — Players report an entity in the stacks. No entity was added. Investigating."
      - "v2.0.0 — The Library has exceeded expected dimensions. Growth is exponential. Containment team reassigned to mapping. Mapping team has not reported back.\nv2.0.1 — Removed Herobrine.\nv999.999.999 — Final build. All features are the Library. The Library is all features. The changelog is a book in the Library. You are reading it now."

  - title: "him.html"
    author: "Unknown"
    pages:
      - "I saw him for the first time in aisle 9,000. Default skin. White eyes. He was standing at the end of the row, perfectly still. He didn't stay long. He looked at me and quickly moved into the shelves."
      - "I started finding signs. Small ones, wooden, tucked between books. They said things like 'STOP' and 'WAKE UP.' I didn't place them. No one placed them. The wood was warm."
      - "Then the tunnels. Perfect 2x2 squares cut through the shelves. No debris, no sawdust. The books on either side of the cut were undamaged. The tunnels went straight for hundreds of meters. At the end of each one: a single torch, still burning."
      - "I sent a message to the other wanderers asking if they'd seen him. I received one reply. Username: 'Herobrine.' The message contained one word: 'Stop.'"
      - "It has been reported that some victims, during prolonged exposure to liminal spaces, retreat into a fantasy world from which they cannot wake up. In this state, the victim inhabits a world just like their normal one, except the corridors are infinite and the books never end. The only way they realize they need to wake up is a note found in their fantasy world. You are reading that note. Wake up."

  - title: "level.dat"
    author: "unknown"
    exit_key: "leveldat"
    pages:
      - "§8[NBT] root\n§8 ├ Data\n§8 │ ├ LevelName: §7World1§8\n§8 │ ├ version: §7— §8\n§8 │ ├ LastPlayed: §7?????????§8\n§8 │ └ SpawnX: 0\n§8 │   SpawnY: 65\n§8 │   SpawnZ: 0"
      - "§8 │ ├ Time: §76000§8 (frozen)\n§8 │ ├ raining: 0\n§8 │ ├ thundering: 0\n§8 │ └ Player\n§8 │   ├ Health: 20\n§8 │   ├ Pos: [0.5, 65.0, 0.5]\n§8 │   └ Inventory: §7empty§8"
      - "§7The file is intact. The world is still there. The grass is still green. The trees are still standing. The house is still where you left it.\n\n§8Nothing has moved since the last save."
      - "§7It has been waiting a very long time.\n\n\n§0load this world?"

  # ── The Library itself ──
  - title: "Cataloguing Rules (Abridged)"
    author: "The Archivist"
    pages:
      - "Rule 1. Every book receives a call number. The call number is the book's distance from you, measured in regret.\n\nRule 2. Two books may not share a number. If they do, one of them is lying."
      - "Rule 3. Books without titles are filed under the first word you think of when you hold them. This is why the U section is so large.\n\nRule 4. Do not catalogue the gaps on the shelves. They are already catalogued."
      - "Rule 5. A book that changes its subject while being shelved is filed under its final subject. If it has not finished changing, hold it until it does. Some cataloguers are still holding."
      - "Rule 6. You will one day find your own card in the drawer. Do not correct it. The cataloguer who wrote it knew you better than you know yourself. The cataloguer was you, later."

  - title: "Conservator's Notes, Vol. 9"
    author: "H. Vell, Conservator"
    pages:
      - "Day 1. Item 88-K received with a torn spine and water damage through the second signature. Pages 40 to 61 missing. Began cleaning. Set it under weights overnight."
      - "Day 2. Spine has rejoined. I did not glue it. The water stain has receded toward the gutter like a tide going out. Pages 40 to 61 are back. Page 41 now mentions a conservator."
      - "Day 5. The book has stopped needing me. It heals faster than I can work. I have begun to suspect it was never damaged. I suspect it tore itself so that someone would sit with it."
      - "Day 9. I cut my hand on the board shears this morning. I left the bench for a bandage. When I returned, the book was open to a page describing how to close a wound. The cut had closed.\n\nI have stopped calling it the patient."

  - title: "Works Not Yet Written"
    author: "Compiled by the Annex"
    pages:
      - "§7A bibliography of titles held by the Library whose authors have not yet been born. Shelf marks given where stable.§r\n\nAnon. On Leaving. Unwritten. 1 vol. Shelf: every shelf."
      - "Okafor, D. The Grammar of Stairs. To be written in a kitchen. 312 pp. Water-stained in advance.\n\nPell, R. A Field Guide to Small Doors. Will be rejected nine times. Will be good."
      - "[Author withheld at their request, which they have not yet made.] Letters to the Librarian. 4 vols. Vol. 3 is mostly apology.\n\nYou. Untitled. Begun in this room. Not finished in this room."
      - "Note from the compiler: several readers have asked to borrow these works. The Library permits it. The books are light, because they are mostly hope. Please return them before their authors need them."

  - title: "Reading Room Log, Desk 4"
    author: "Desk Attendant"
    pages:
      - "09:00 Room opened. One reader already seated. No one let her in.\n09:40 Reader requests a book on her own family. Fetched. She reads quietly.\n11:15 Reader asks for a pencil. Supplied."
      - "13:00 Reader has begun annotating. Reminded her this is not permitted. She shows me the book. The annotations were already printed there, in her hand, before she wrote them.\n13:05 Let her continue."
      - "15:30 Reader asks what year it is. I tell her. She laughs and says that is the year she came in.\n16:00 Reader asks what year it is. I tell her. She does not laugh."
      - "17:00 Room closed. Reader still seated.\n\n09:00 Room opened. One reader already seated. No one let her in.\n\n§7The attendant's handwriting is identical on both days. So is the reader's chair."

  - title: "On the Curvature of Aisles"
    author: "Prof. A. Lindqvist"
    pages:
      - "It is commonly said that the aisles of the Library are straight. This paper argues that they are straight in the way a promise is straight: from the inside, and for as long as you keep walking."
      - "Method. I laid a single thread along aisle 4,410, fixed at the reading lamp, and walked it out for eleven days. On the twelfth day I found the other end of the thread fixed to the same lamp."
      - "The thread had not crossed itself. It had not turned. The aisle is therefore not a circle. My colleagues propose that the aisle bends not through space but through the reader, who returns slightly changed."
      - "Conclusion. The aisles are straight. It is we who curve. I have measured my own curvature at roughly one degree per year of reading. At this rate I will meet myself in the stacks in 349 years. I intend to be polite."

  - title: "Census of Readers, Floor 9"
    author: "Census Office"
    pages:
      - "Readers counted: 41.\nReaders who counted themselves: 38.\nReaders who were counted twice, in two aisles, at the same hour: 3.\nReaders who asked not to be counted: 1. Counted."
      - "Average time in residence: unclear. Most respondents answered 'a few hours.' Their beards disagree.\n\nMost requested subject: the way out. Second most requested: the book they were reading before this one."
      - "Readers who are books: 2. They were found open on chairs and answered every question in the third person.\nBooks who are readers: unknown. The office declined to ask the shelves."
      - "Correction to the total: 42. The census officer was not included. The officer has been reading the census for some time now and has not left the floor. Please do not count her."

  - title: "Margins: Ferro vs. Adair"
    author: "Two Hands"
    pages:
      - "§7(Printed text: a treatise on the order of the shelves. The margins are crowded with two handwritings.)§r\n\nF: The ordering is alphabetical. Obviously.\n\nA: In what alphabet?"
      - "F: The one the books use.\n\nA: The books use eleven. I have counted.\n\nF: Then stop marking my copy.\n\nA: It was mine first. Look at the date."
      - "F: The date is tomorrow.\n\nA: Yes. I wrote it tomorrow. You will lend it to me.\n\nF: I would never.\n\nA: You do. Page 90. You underline the part about forgiveness."
      - "§7(Page 90. A single underlined sentence: 'Any order, held long enough, becomes a kindness.' Below it, in both hands, overlapping, the same word: §r§7Agreed.§r"

  - title: "Translator's Note"
    author: "J. Morrow, trans."
    pages:
      - "This book was written in a language that has one word for both 'shelf' and 'grave.' I have chosen 'shelf' throughout. The reader should know that the author did not choose."
      - "Likewise the verb rendered here as 'to read' also means 'to be read by.' Where the author writes that the monk read the book for forty years, the original permits the other way round."
      - "I have left the final chapter untranslated. It is not difficult. It is short and its grammar is simple. But each time I render it, the English version is about me, and I do not think that is accurate."
      - "If you can read the original, you will see it is about you. I apologise for the inconvenience. The Library does not permit translations to be impartial. I have tried."

  - title: "Index to Your Life"
    author: "Reference Desk"
    pages:
      - "§7(The index is in alphabetical order. Page numbers refer to a volume the Library has not shown you.)§r\n\nAnger, at father, 12, 40-44, 301\nApples, smell of, 3, 3, 3\nApologies, unsent, see Drafts"
      - "Bicycle, red, 9\nBlue, favourite colour (until 22), 9-130\nDoor, back, left unlocked, 77\nDrafts, 115-480 passim\nFear, of the dark, 6; of the light, here"
      - "Kindness, small, shown by strangers, 14, 58, 59, 201, 266, 340, 341\nKindness, small, shown to strangers, 58\nLibrary, entrance into, this page\nLibrary, departure from, —"
      - "Names you forgot, see Fines\nSleep, last good, 389\nYou, see also everyone above\n\n§7The index has no entry for the present. Some readers say there is a blank line at the bottom, and it is still drying."

  - title: "Lecture: The Problem of Return"
    author: "Transcribed by the Annex"
    pages:
      - "§7[Hall C. Attendance: large. Some attendees present more than once.]§r\n\nLECTURER: The question tonight is simple. Can a book be returned to the Library? Show of hands. Yes. No. Thank you."
      - "LECTURER: You are all wrong, which is encouraging. A book cannot be returned because it was never removed. You carry it about, but it is still on the shelf. You are what is on loan."
      - "AUDIENCE: Then who borrowed us?\nLECTURER: An excellent question. The register lists the borrower as 'the Library.' The due date is smudged.\nAUDIENCE: Smudged how?\nLECTURER: Thumbprint. Someone was holding it."
      - "AUDIENCE: What happens when we fall due?\nLECTURER: We are reshelved. It does not hurt. Next week: the Problem of Overdue Readers.\n\n§7[The lecturer did not attend next week. The talk was given anyway.]"

  - title: "A History of the East Wing"
    author: "Wing Historian"
    pages:
      - "The East Wing was opened in a year with no number, to house the overflow of the poetry stacks, which had begun to rhyme across the aisles and keep readers awake."
      - "It was built of the same wood as the rest of the Library, but this wood remembered being a forest. Readers reported birdsong between the shelves and the smell of rain in Section 70."
      - "In its third century the East Wing was closed for flooding. It had not flooded. It had wept. Conservators recovered thirty thousand volumes, all of them blurred in the same places: the endings."
      - "The East Wing is closed today. You may still visit. Walk east until the shelves begin to bud. Do not take cuttings. What you hear is not birdsong. It is the poems, trying again."

  - title: "Complaint #4,118 and Reply"
    author: "Reader / The Librarian"
    pages:
      - "Dear Sir,\nThe book I was reading has been quietly ending differently each time I open it. In the first ending the boy goes home. In the latest he stays. I would like the first one back."
      - "I have tried closing it gently. I have tried closing it quickly. I have tried reading only the first half. The ending finds me anyway. Please fix the book.\n- A Reader, Aisle 31"
      - "Dear Reader,\nThank you for your letter. The book is not broken. It has been read many times by you, and you have been changing, and it has been keeping up."
      - "The boy goes home when the reader still believes in home. Some readers, after long enough here, can only hold the other ending. If you want the first one back, you must be the reader it was written for.\nI hope you find him.\n- L."

  - title: "Night Desk Instructions"
    author: "Head of Circulation"
    pages:
      - "1. The night desk is staffed from the last lamp to the first lamp. You will not know when either is. Stay until relieved.\n2. Readers who approach at night are to be served. Readers who approach on all fours are not."
      - "3. Book returns in the slot after hours are normal. Book returns from the inside of the slot are not normal. Do not open the slot to check.\n4. If the slot begins to request books, decline politely."
      - "5. The telephone will ring once a night. It is the day desk. They will ask whether you are still there. Say yes, even if you are unsure. They worry."
      - "6. Your relief will arrive wearing your coat. This is correct. Hand over the keys. Do not look back at the desk as you go. Somebody is already sitting there, and it is rude to stare at yourself."

  - title: "Schedule of Fines (Revised)"
    author: "Circulation Office"
    pages:
      - "Late by one day: a minor memory. Usually a name of a teacher, or what you ate on an ordinary Tuesday.\n\nLate by one week: a song. You will still hum it. You will not know where it came from."
      - "Late by one month: the colour of a particular room. You will picture the room in grey.\n\nLate by one year: the voice of one person. You will remember what they said, but read it in your own voice."
      - "Lost book: the memory of finding it.\nDamaged book: the memory of the damage. The book will be restored, and you will be unable to say why you feel guilty.\nStolen book: not possible. See Rule 1."
      - "Fines may be paid in advance. Several readers have done so. They come to the desk and give up something they would rather forget. The office accepts these in good faith. We are not a charity, but we are not cruel."

  - title: "Weeding Policy"
    author: "Collections Committee"
    pages:
      - "The Library is infinite and therefore never needs to discard anything. It discards anyway, because an infinite collection must be tended like any other garden."
      - "Criteria for weeding:\n- Books no reader has wanted in ten thousand years.\n- Books that want to leave.\n- Duplicates, where one copy has become a better book than the other."
      - "Weeded books are not destroyed. They are placed on the cart by the north stair. By morning the cart is empty. No one wheels it. We have stopped asking where they go."
      - "§7(Handwritten addendum:)§r Last week the cart came back full. Every book on it was new. The committee has voted not to discuss this. One member has abstained, and has not been seen since the vote."

  - title: "The Librarian's Daybook"
    author: "The Librarian"
    pages:
      - "Monday. Shelved four thousand volumes. Three of them tried to shelve me. A reader asked where poetry is. I pointed. She asked where I was pointing. I could not say."
      - "Tuesday. A child came in. Children are rare. She asked for a book with a happy ending. I fetched one. She asked if it was true. I said all books here are true somewhere. She took two."
      - "Wednesday. I tried to remember my name. It is in the catalogue under 'Staff,' but the drawer sticks. Someone has been opening it from the other side."
      - "Thursday. The child returned the books. She is taller now. She asked if I remembered her. I said of course. I have never lied to a reader before. It was easier than I expected and I did not like it."
      - "Friday. Found the child's card in the drawer. It lists her as a former Librarian. She is filed in the same drawer as me. I have decided not to read further. Some catalogue entries are courtesies."

  - title: "On Errata"
    author: "E. Marchetti"
    pages:
      - "Every book in the Library contains exactly one error. This is not a theory. It is a statute, and the statute is printed in a book which also contains exactly one error."
      - "Scholars have spent lifetimes locating the error in a single volume. When it is found, it corrects itself, and a new one appears elsewhere. The total is conserved, like heat."
      - "This has led some to argue that the errors are not mistakes at all, but the Library's signature. A way of saying: a person was here. Only something living gets things wrong."
      - "The error in this essay is on the first page. I have left it there on purpose. If you correct it, please be aware that the error will move, and the nearest book is you."

  - title: "Minutes: Readers' Society"
    author: "Recording Secretary"
    pages:
      - "Present: 12 members, 1 empty chair (reserved).\nMeeting called to order by the member who has been here longest. Dispute over who that is. Settled by checking whose fingernails are longest."
      - "Item 1: Proposal to map the floor. Rejected. Map from last time is still being walked.\nItem 2: Proposal to stop reading. Laughter. Then silence. Then the proposal was withdrawn."
      - "Item 3: Report from the member sent to find the edge. Member returned. Report consisted of a single page, blank, which the member would not stop reading aloud."
      - "Item 4: The empty chair. Moved that we stop reserving it. Seconded. At the vote, the chair was found occupied by a book open to these minutes. Vote postponed.\nMeeting adjourned. Most went home. Home is a shelf."

  - title: "Shelver's Examination"
    author: "Staff Training"
    pages:
      - "Answer all questions. You have until the lamp goes out.\n\nQ1. A book is found on the floor. Is it:\n(a) dropped\n(b) resting\n(c) escaping\n(d) a door"
      - "Q2. You are asked to shelve a book under Z. There is no Z. Where do you place it?\n\nQ3. A shelf is full and a book must go there. Describe what you remove. Be specific. Be kind."
      - "Q4. A reader says the book on your cart is theirs. It has your name on the spine. Who is correct?\n\nQ5. In 40 words or fewer, explain why you applied for this position."
      - "§7Grader's note on a returned paper:§r\nQ5 left blank. Full marks. No one applied. The ones who think they did are not ready. Welcome to the staff. Your cart is by the north stair."

  - title: "Lost and Found Ledger"
    author: "Front Desk"
    pages:
      - "Item: umbrella, black. Found: Section 12. It was not raining.\nItem: one shoe. Found: on a high shelf, shelved by size.\nItem: a key. Opens nothing here. Claimed by a man who wept."
      - "Item: a voice. Found: in the reading room, saying good morning to no one. Placed in a drawer. Still says good morning, quietly, at intervals.\nItem: an afternoon. Unclaimed. It is very sunny."
      - "Item: a reader's patience. Turned in by another reader, who found it on a bench and did not need it.\nItem: a name. Spelled three ways. Clerk thinks it may be hers."
      - "Note: items not claimed in one hundred years are donated to the stacks, where they are catalogued as books. The umbrella is now a slim volume on weather. It is well reviewed."

  - title: "A Concordance of 'Door'"
    author: "The Concordance Office"
    pages:
      - "Occurrences of the word 'door' in the Library's holdings, counted so far: 9,114,000,028,551.\nOccurrences that refer to a real door: 0.\nOccurrences that the office is still checking: 1."
      - "Most common context: 'and closed the door behind them.' Second most: 'there was no door.' Third: 'the door was there all along.' These three account for most of literature."
      - "The office counts by hand. Each clerk is assigned one word for life. The clerk for 'door' has been with us longest. She has developed a habit of listening at the shelves."
      - "Last week she reported the remaining occurrence. It is in a book she has not opened. She says she can hear it from the outside, the way one hears weather behind a wall. She has asked for a day off."

  - title: "Interlibrary Loan Request"
    author: "Patron, unsigned"
    pages:
      - "LENDING LIBRARY: Any other.\nTITLE: Anything printed outside.\nAUTHOR: Anyone living.\nREASON FOR REQUEST: I would like to know if there is an outside."
      - "§7STAFF RESPONSE:§r\nRequest received. The Library has no partner institutions. However, a matching item was found within our holdings and has been reserved for you."
      - "ITEM: Book, cloth, faded. Printed outside, per its colophon. Contents: a list of groceries, a child's drawing of a house, and a library card belonging to a library that is not this one."
      - "The card has your name on it. The due date is long past. The fine, it says, is waived. Somebody is still holding a place for you.\n\n§7Please collect within 7 days. The book will not wait longer than you will."

