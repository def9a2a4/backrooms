      - "§7- Added the Lantern of Return. Hold it at spawn to see where everyone was standing the last time they logged in\n§7- Old friends now appear on the multiplayer screen even if their servers are gone"
      - "§7- Wolves no longer stop waiting\n§7- Fixed a bug where wolves stopped waiting\n§7- Added a sound for when someone you know is near. You will recognise it"
      - "§7Known issues:\n§7- None of this was shipped\n§7- The next version was 1.0\n§7- Everything in these notes was removed before it was added\n\n§8\"it was a nice idea\" - unknown"

  - title: "README (Quietpack 16x)"
    author: "sleepyfern"
    pages:
      - "§8Quietpack 16x\n§8for Beta 1.7.3\n\n§7hi!! this is my first texture pack. it makes everything a bit softer. grass is less green. the sky is a little more grey. its for playing at night."
      - "§7install:\n§7put the zip in .minecraft/texturepacks\n§7dont unzip it!!\n\n§7changes:\n§7- softer grass\n§7- quieter sky\n§7- creeper is sad now (look at him)"
      - "§7- i redid the moon. its my moms face from a photo, very small, you cant tell. dont tell anyone\n§7- painting kebab is now my cat"
      - "§7v1.1:\n§7- the moon is the moon again. people asked why the moon looked at them. it doesnt. it just looks\n\n§7v1.2:\n§7- put her back. i missed her"
      - "§7v1.3: no changes. just wanted to say thanks to whoever is still using this. the download counter goes up by one sometimes. i like to think its the same person.\n\n§7- fern"

  - title: "Coordinates (Do Not Lose)"
    author: "Tomas"
    pages:
      - "§7x 0 — spawn. our hut.\n§7x 1,000 — the oak we named.\n§7x 10,000 — desert temple, looted, sign says TOMAS WAS HERE\n§7x 100,000 — nothing. just more. good."
      - "§7x 1,000,000 — the boat broke 3 times. ran out of food twice. still sunny.\n§7x 5,000,000 — the clouds got weird. the sun doesnt move right."
      - "§7x 12,550,820 — I can see it. the ground goes up like a wall with windows. the game stutters. my footsteps sound late."
      - "§7x 12,550,821 —\n\n§7nobody will ever walk here again. they fixed it. the next version just has more grass.\n\n§7so this is the only copy. I wrote down the way. in case anyone wants to come see where the world ended."

  - title: "Forum: anyone else get Grey?"
    author: "thread #48102"
    pages:
      - "§8[old forum, thread 48102]\n§8posted by: duskmoss\n\n§7anyone else ever have a world called Grey in their singleplayer list? I never made it. no thumbnail. size 0 KB. last played: today."
      - "§8reply - kip_t:\n§7deleted file probably. corrupted save.\n\n§8reply - duskmoss:\n§7its been there since my first install. I just reinstalled on a new laptop. its there again. last played: today."
      - "§8reply - duskmoss:\n§7opened it. its my old world. my first one. from when I was 9. everything I built. but the grass is grey. the water is grey. the sky is grey and nothing moves."
      - "§8reply - duskmoss:\n§7my house is there. inside on the table: a book. its in my handwriting from when I was 9. it says \"you said you'd come back\"\n\n§7I don't remember writing it."
      - "§8reply - duskmoss:\n§7I went back in to save it properly. its gone from the list now.\n\n§8[thread locked: user requested]\n§8[last seen: never]"

  - title: "Before the Hunger Bar"
    author: "an old player"
    pages:
      - "§7I'll tell you what it was like before the hunger bar.\n\n§7You ate a pork chop and the hearts came back. That was it. Nobody was ever hungry. You could just stand on a hill and watch."
      - "§7The night was louder. The zombies said \"mrrh\" and nothing else. The sky had a band of fog at the edge of the world that looked like a sea you couldn't reach.\n\n§7There was no ending. No dragon."
      - "§7We didn't need one. You played until the light was gone in your real room too, and then you turned it off, and the world waited."
      - "§7I'm told it's all still here, somewhere in this Library. Every old version. Every alpha save.\n\n§7If you find mine, there's a dirt hut on a hill. Sit in it a minute. Don't eat anything. You won't need to."

  - title: "saves/"
    author: "dir listing"
    pages:
      - "§8 Directory of saves\n\n§8 New World\n§8 New World-\n§8 New World--\n§8 test\n§8 test 2\n§8 SURVIVAL REAL\n§8 SURVIVAL REAL 2\n§8 castle (dont delete)"
      - "§8 maddie's world\n§8 maddie's world (copy)\n§8 creative lol\n§8 Dad's world\n§8 Dad's world (backup)\n§8 Dad's world (backup)\n§8   (2)"
      - "§7Dad's world is a single flat plain with one house, built very carefully and very badly. The roof is upside down stairs. A sign over the door:\n\n§8\"made with help\n§8 from maddie\""
      - "§7The backups are identical. The backup of the backup is identical. Somebody kept copying it to new computers for years and never once opened it.\n\n§7You don't have to open something to keep it."

  - title: "My Diary (Do Not Read)"
    author: "Ivy, age 10"
    pages:
      - "§7DAY 1\n§7this is my diary for my world. i made a house out of wood. a spider was on the roof. i named him Steve 2.\n\n§7DAY 2\n§7Steve 2 killed me. we are not friends."
      - "§7DAY 5\n§7i found a village. the villagers say hmm a lot. i built them a wall. now they are safe forever.\n\n§7DAY 9\n§7my brother came on. he made tnt. we dont talk about day 9."
      - "§7DAY 30\n§7the villagers have 14 babies now. i named all of them. this is the best world ever made in the whole entire world.\n\n§7DAY 31\n§7i have to go to bed."
      - "§7(no more entries)\n\n§7The book sits on a lectern in a wooden house. The wall around the village is still standing. Inside it, some of the babies are very old now. They still say hmm."

  - title: "Map #0"
    author: "a cartographer"
    pages:
      - "§7Map #0. The first one ever made in that world. The ink was a 1:1 scale, a small square, the spawn right in the middle.\n\n§7You could see the hut. The dirt path. The pond where we fished."
      - "§7Later maps were bigger. We made a wall of them in the town hall, ninety-six maps wide, the whole continent.\n\n§7But they all got thrown in a chest when the server reset. Map #0 got kept."
      - "§7The odd thing about maps in that version: they only update while someone holds them. So Map #0 shows the world as of the last time anyone looked.\n\n§7The hut is there. The path. Two little white arrows by the pond."
      - "§7The arrows are players. Nobody has held the map since. They are still there, by the pond.\n\n§7They will always be by the pond."

  - title: "screenshots/"
    author: "F2"
    pages:
      - "§82012-06-01_17.22.04.png\n§7four people on a roof. one is upside down because of a glitch. everyone is crouching to say hi.\n\n§82012-06-01_17.22.05.png\n§7same picture. someone pressed F2 twice."
      - "§82012-08-19_21.03.40.png\n§7the sunset over the bay. the bridge is half built. a boat is stuck on it.\n\n§82012-12-24_20.00.00.png\n§7snow. presents made of chests. one says FOR NOAH."
      - "§82013-04-02_15.10.11.png\n§7the roof. two people now. crouching.\n\n§82014-09-30_23.59.59.png\n§7the roof. one person. not crouching. just looking at the bay."
      - "§82026-??-??_??.??.??.png\n§7the roof. nobody on it. the bridge is finished.\n\n§7Nobody took this one. It's in the folder anyway."

  - title: "MOTD: Thanks for Six Years"
    author: "admin_greyowl"
    pages:
      - "§8§lMOTD§r§8:\n§7Server closing 31st. Thank you for six years. Download links for the world are on the forum. Please take your stuff.\n\n§8Players online: 2/40"
      - "§7To everybody who joined on the first day: I still have the spawn you built. To the kid who flooded the market twice: we forgive you. To whoever kept leaving bread at the old fountain: we saw."
      - "§7The hosting is paid through midnight. I'm going to stay on until it goes down. You're welcome to come and sit at the fountain.\n\n§8Players online: 1/40"
      - "§7The world download link on the forum is dead. The forum is gone. But the hosting company never did shut the box off.\n\n§8Players online: 0/40\n§8Bread at the fountain: 1"

  - title: "Hardcore: Day 2,212"
    author: "spectator"
    pages:
      - "§8You died!\n§8Score: 18,402\n\n§8[Spectate world]\n§8[Delete world]\n\n§7That was the choice. Two buttons. I picked the first one, because I couldn't pick the second."
      - "§7Day 2,212 of my hardcore world. I died on day 1,940. A skeleton, at night, on the stairs to my own front door. Six years. One arrow."
      - "§7I fly through the walls now. I can't touch anything. I watch the farms I built keep running. The iron golems still patrol. The villagers still trade with nobody."
      - "§7I log in sometimes and just float over the house. Everything I made keeps going without me.\n\n§7I think that's what I wanted, all along. I just didn't know I'd be watching."


# Entry books: the archive contains the old worlds. Rolled before the
# pre-written pool (so level.dat keeps its rarity); any entry book is about
# 1 in 15 books at 0.07. Each ends with its own hidden §0 question — opening
# the book and finding it is the door (see level_64637.yml open_book triggers).
entry_book_chance: 0.07
entry_books:
  - title: "Walking Log"
    author: "unknown"
    exit_key: "walking_log"
    pages:
      - "day 12\n\nflat again today. grass and more grass. the map says I should have reached the edge of the known render by now.\n\nday 15\n\nthe horizon looks wrong. not far away. wrong."
      - "day 31\n\nthe ground is doing something I don't have a word for. sheets of it standing on end. holes you can see the sky through, pointing down."
      - "day 44\n\nthe math gives up out here. you can feel it giving up.\n\nday 45\n\nI can see it now.\n\nday 46\n\n\n§0keep walking?"
  - title: "Rules and Challenges"
    author: "crew"
    exit_key: "rules"
    pages:
      - "SKYBLOCK v1.1\n\nRULES:\n1. Do not jump off.\n2. Do not bridge past the sky.\n\nCHALLENGES:\n1. Build a house.\n2. Expand the island."
      - "3. Make a wheat farm.\n4. Make a cobblestone generator.\n5. Craft a bed.\n6. Do not look at the barrier.\n7. Do not count the challenges.\n8. Build a house."
      - "9. There is no challenge nine.\n10. Expand the island.\n\n\n§0accept the challenge?"
  - title: "planetoids.jar"
    author: "unknown"
    exit_key: "planetoids_jar"
    pages:
      - "§8planetoids.jar\n§8version: 1.77b\n§8requires: nothing that still exists\n\n§7A generator for making worlds out of worlds. Spheres of grass, of sand, of ice, of lava. Hanging in the dark."
      - "§7usage:\n§8  java -jar planetoids.jar\n\n§7The program is small. The output is not. Nobody has found the last planet.\n\n§8exit code: still running\n\n\n§0generate?"
  - title: "Groundskeeper's Notes"
    author: "staff"
    exit_key: "groundskeeper"
    pages:
      - "Trimmed the east run. The hedge had grown three feet overnight, all of it toward the benches.\n\nNote for next shift: the shears go dull faster than they should."
      - "Found the center again today. It had moved. Logged it with the office; they say the map is correct and I am not.\n\nThe topiary by the gate. Nobody planted it. It is a person now. Was it always?"
      - "Last entry. The garden does not need keeping. It keeps itself.\n\nIt keeps everything that walks in after dark.\n\n\n§0step inside?"
  - title: "11"
    author: "C418"
    exit_key: "eleven"
    pages:
      - "§8transcript: 11.ogg\n\n§80:00 — footsteps. gravel.\n§80:08 — breathing.\n§80:21 — footsteps stop.\n§80:25 — they continue. faster."
      - "§80:42 — a cave sound. not near.\n§80:51 — pages turning. paper?\n§81:01 — cough (equipment?)\n§81:05 — §7damaged past this point."
      - "§7There are six more seconds.\n\n\n§0play the remaining 0:06?"
  - title: "r.0.0.mca"
    author: "SYSTEM"
    exit_key: "mca"
    pages:
      - "§8region file r.0.0.mca\n§8chunks expected: 1024\n§8chunks found: 1025\n\n§7One of these chunks is wrong. It was wrong before it was saved. The save only made it permanent."
