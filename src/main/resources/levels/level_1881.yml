id: level_1881
display_name: "Hintze Hall"
generator: scan
environment: NORMAL
dimension_type: light
biome: "backrooms:museum"
fixed_time: 6000
spawn_radius: 0
enter_message: "§7§oThe museum is closed. The lights are on anyway."

# The Natural History Museum's Hintze Hall (London, opened 1881) at 16x, voxelized from a 3D scan
# that's downloaded on first start (config.yml meshes). The blue whale hangs over the nave.
# Placards on lecterns around the arrival point (books in level_1881_placards.yml) describe places:
# read one to its last page and you're taken there.
generator_config:
  mesh: hintze_hall
  mode: shell
  scale: 16
  ground_y: -62
  thickness: 1.5
  spawn: {x: -40, z: -120}
  placards: level_1881_placards.yml
  props:
    - {type: lectern, x: -24, z: -104, block: "lectern[facing=west]", book: guide}
    - {type: lectern, x: -56, z: -104, block: "lectern[facing=east]", book: henge}
    - {type: lectern, x: -24, z: -136, block: "lectern[facing=west]", book: tepe}
    - {type: lectern, x: -56, z: -136, block: "lectern[facing=east]", book: hope}

events:
  - ambient_sound

event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 8
    chance: 0.3
    sounds:
      - ambient.cave
      - block.wooden_door.close
      - entity.skeleton.step

exit_triggers:
  - type: lectern_last_page
    book_title: "Stonehenge"
    target_level: level_56
    fallback_level: level_3
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "§7The fog lifts. The stones are where you left them."
  - type: lectern_last_page
    book_title: "Göbekli Tepe"
    target_level: level_9500
    fallback_level: level_3
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "§6Eleven thousand years go by in a page."
  - type: lectern_last_page
    book_title: "Visitor Guide"
    target_level: level_3
    transition:
      blindness_ticks: 60
      delay_ticks: 20
      message: "// exiting through the gift shop. returning to the server room."
  - type: below_y
    y_threshold: -64
    target_level: level_1881
    transition:
      blindness_ticks: 40
      delay_ticks: 10
      message: "§7§oA guard walks you back to the hall."
