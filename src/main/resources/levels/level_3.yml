id: level_3
display_name: "The Server Room"
generator: level_3
environment: NETHER
dimension_type: fullbright
biome: "backrooms:server_room"
enter_message: "§c[ERR] §7Unauthorized access detected."

generator_config:
  command_block_chance: 200
  command_block_kinds:
    - weight: 1
      target: level_4
      messages:
        - "§7// RUN terrain_gen --legacy --overflow\n§8// WARNING: coordinate bounds exceeded\n§7// EXEC farlands.jar"
        - "§7> load world_alpha_1_7_3\n§8[ERR] World boundary undefined\n§7> force_load --no-limit"
        - "§7/* TODO: fix integer overflow in\n   terrain generation */\n§8// See: JIRA-12481287"
        - "§7> getBiome(12550821, 64, 12550821)\n§8[ERR] Return value: null\n§7// Biome registry corrupted"
        - "§7// RESTORE backup_alpha_1_7_3.dat\n§8Backup predates coordinate system.\n§7// Restoring anyway..."
        - "§7> terrain_gen --seed 0\n§8[WARN] Seed 0 produces undefined\n§8  geometry past X=12550824\n§7// Known issue. Will not fix."
    - weight: 1
      target: level_5
      messages:
        - "§7// PLAY audio_11.dat\n§8[WARN] File corrupted at 0x00B1\n§7// Recovered 1:05 of 1:11"
        - "§7> extract C418/11.ogg\n§8Access denied. File locked by:\n§c  UNKNOWN_PROCESS"
        - "§7/* The recording was never meant\n   to be found. Stop listening. */"
        - "§7> ffprobe 11.ogg\n§8Duration: 1:11 (expected)\n§8Channels: 2 (expected)\n§c  Channel 3: UNKNOWN_SOURCE"
        - "§7// DECRYPT 11.ogg --key=????\n§8[ERR] File is not encrypted.\n§7// Then why can't we read it?"
        - "§7> strings 11.ogg | grep -i help\n§8  Match at 0x00B1: \"help me\"\n§c  Match at 0x00B1: \"run\""
    - weight: 1
      target: level_7
      messages:
        - "§7// LOAD chunk r.0.0.mca\n§c[FATAL] Chunk data corrupted\n§7// Attempting recovery...\n§c// Recovery failed."
        - "§7> /gamerule worldGenSeed ???\n§8Seed mismatch detected.\n§cAll chunks invalidated."
        - "§7/* Every block type at once.\n   The generator has lost its mind. */"
        - "§7> chunkinfo r.0.0.mca\n§8  Blocks: 65536 unique (of 65536)\n§c  Expected: <800\n§7// Every palette entry used."
        - "§7// VALIDATE chunk_422.nbt\n§8[ERR] NBT depth exceeds MAX_INT\n§c// Data references itself."
        - "§7> diff chunk_422.nbt chunk_422.bak\n§8  Files are identical.\n§c  Backup is also corrupted."
    - weight: 1
      target: level_64637
      messages:
        - "§7// OPEN archive_64637.lib\n§8[INFO] Indexing 2^64637 entries...\n§7// Estimated time: undefined"
        - "§7> ls /data/changelogs/\n§8  total: ∞\n§7  Every version. Every change.\n  Every line of code."
        - "§7/* The library contains everything\n   that was ever written, and\n   everything that will be. */"
        - "§7> cat /archive/index.dat\n§8[INFO] Index contains your name.\n§7// How?"
        - "§7> du -sh /archive/\n§8  Size: NaN\n§8  Files: more than last time\n§7// Archive is still growing."
        - "§7/* Entry 64637.0.0.1:\n   Title: This Terminal\n   Author: You\n   Status: Being Read Right Now */"
    - weight: 1
      target: level_101
      messages:
        - "§7// RESTORE world --snapshot=alpha\n§8[WARN] Snapshot predates changelog.\n§7// Last verified: a long time ago"
        - "§7> ls /backups/\n§8  world_alpha/  §7(untouched)\n§8[INFO] Nothing has moved since\n§8  the last save."
        - "§7/* Rollback target: the first day.\n   Grass. Trees. A house someone\n   built and never came back to. */"
        - "§7> diff world/ backups/world_alpha/\n§8  Everything is different.\n§8  Nothing has changed."
        - "§7// WARNING: rollback cannot be\n// undone. The old world does not\n// know about you yet.\n§8// Proceed? [Y/n]"
        - "§7> stat world_alpha/level.dat\n§8  Modified: ?????????\n§8  Accessed: just now\n§7// Who opened it?"
    - weight: 1
      target: level_56
      messages:
        - "§7> gunzip henge.mesh.gz\n§8  9899 triangles. 0 owners.\n§7// The stones were counted once.\n// They did not agree to the count."
        - "§7> date --at 51.1789N 1.8262W\n§8[WARN] clock source: SUN\n§7// System time is set by the solstice."
        - "§7/* They kept their own herds.\n   They knew the animal's name\n   before they knew its weight. */"
        - "§7> cat /henge/.offering\n§8  format: pork\n§8  source: unknown\n§7// The stone does not ask where it came from.\n// It used to."
        - "§7/* Somewhere a machine cuts meat\n   for people who never met the pig.\n   Here, you will meet the pig. */"
        - "§7> diff farm.log factory.log\n§8< raised it, fed it, killed it\n§8> scanned barcode\n§7// Something was lost in the diff."
    - weight: 1
      target: level_1881
      messages:
        - "§7> mount /archive/1881\n§8  [OK] 80,000,000 specimens indexed\n§7// Every one was found by someone\n// who was paying attention."
        - "§7/* A whale hangs from the ceiling.\n   Twenty-five meters of an animal\n   we very nearly finished. */"
        - "§7> ls /museum/cases/\n§8  henge/  tepe/  server_room/\n§7// Each case is a door. Glass breaks."
        - "§7> git log --since='4.5 billion years ago'\n§8  too many commits to list\n§7// Keep the history. It is the only backup."
        - "§7/* The building is terracotta: fired clay,\n   cast into monkeys, fish and leaves.\n   Even the walls are a catalogue. */"
    - weight: 1
      target: level_1967
      messages:
        - "§7> mount /dev/southbank\n§8[WARN] volume unused since 1967\n§7// Nobody planned for anyone to be here."
        - "§7/* Concrete under a concert hall.\n   Built for nothing in particular.\n   Waiting for someone to decide. */"
        - "§7> find /undercroft -type light\n§8  0 results\n§7// Bring your own."
        - "§7> cat /undercroft/history\n§8  1967: built\n§8  197?: found\n§7// The second date matters more."
    - weight: 1
      target: level_418
      messages:
        - "§7> curl -X BREW http://kettle/coffee\n§8  HTTP/1.1 418 I'm a teapot\n§7// It is short and stout."
        - "§7> render --engine=voxel teapot.obj\n§8[WARN] block engine unavailable\n§7// Falling back to concrete."
        - "§7/* The test scene has no grass.\n   Except once. One log.\n   Don't tell the renderer. */"
        - "§7> ls /assets/test/\n§8  teapot.obj  bunny.ply  dragon.ply\n§8  lucy.ply  suzanne.obj  cornell_box\n§7// Who left these running?"
        - "§7> RFC 2324 --section 2.3.2\n§8  Any attempt to brew coffee with a\n§8  teapot should result in error 418.\n§7// Compliance: total."
        - "§7> grep -r oak_log /voxel_engine/\n§8  1 match.\n§c// That block should not exist here."

events:
  - ambient_sound
  - fake_chat_message
  - inventory_glitch

entities:
  - herobrine

event_config:
  ambient_sound:
    enabled: true
    check_interval_seconds: 4
    chance: 0.35
    sounds:
      - ambient.cave
      - ambient.warped_forest.mood
  fake_chat_message:
    enabled: true
    check_interval_seconds: 45
    chance: 0.15
    messages:
      - "§7[Server] §fRunning garbage collection..."
      - "§c[ERR] §fEntity tick overflow at region r.0.0.mca"
      - "§e[WARN] §fChunk data corrupted — attempting recovery"
      - "§7> kill @e[type=Herobrine]"
      - "§7> gamerule showDeathMessages false"
      - "§c[FATAL] §fWorldGen seed mismatch"
      - "§7> /list\n§f  0/0 players online"
      - "§c[ERR] §fPermission node 'exit.allowed' not found"
      - "§e[WARN] §fRemoved Herobrine."
      - "§7[Server] §fBackup completed. Size: ∞ bytes"
      - "§c[ERR] §fThread 'Reality' stopped responding"
      - "§7> help\n§f  Unknown command."
  inventory_glitch:
    enabled: true
    check_interval_seconds: 60
    chance: 0.1
    swap_count: 3
    restore_delay_ticks: 40

exit_triggers:
  - type: powered_command_block
    target_level: level_4
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// LOADING terrain_gen_legacy.jar ..."
  - type: powered_command_block
    target_level: level_5
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 100
      darkness_ticks: 100
      delay_ticks: 20
      message: "// LOADING audio_11.dat ..."
  - type: powered_command_block
    target_level: level_7
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// LOADING chunk_error_422.bin ..."
  - type: powered_command_block
    target_level: level_64637
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 60
      delay_ticks: 20
      message: "// LOADING archive_64637.lib ..."
  - type: powered_command_block
    target_level: level_101
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "§7> restoring world from snapshot alpha ... §aOK"
  - type: powered_command_block
    target_level: level_56
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// LOADING henge.mesh.gz ..."
  - type: powered_command_block
    target_level: level_1881
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// LOADING archive 1881 ... (please do not touch the exhibits)"
  - type: powered_command_block
    target_level: level_1967
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// LOADING /dev/southbank ... no lights found"
  - type: powered_command_block
    target_level: level_418
    power_count: 16
    window_ticks: 80
    radius: 20
    transition:
      blindness_ticks: 80
      delay_ticks: 20
      message: "// BREW coffee ... §c418"
