    - "The shelves went on past where the light reached."
    - "I found a copy of #book_name# with my name on the borrowing card. I have never been here before."
    - "Every aisle ends in another aisle."
    - "The index lists #~word# under #~word#. Neither is a word."
    - "Someone has been reshelving behind me."
    - "The books on this shelf are all the same book, but the endings differ."
    - "I read for what felt like {n:2-90} hours. The candle did not get shorter."
    - "The Librarian left a note in the margin. It said '#margin#'."
    - "Shelf {n:2-900}, row {n:2-90}. I have stopped counting the rows."
    - "The quiet here has a texture."
    - "A reader at the next table turned pages for hours. Every page was blank."
    - "The catalogue says this book is on this shelf. The shelf says it is out."
    - "I found my own initials in pencil on a flyleaf, faded, very old."
    - "The lamps here burn #colour#."
    - "Every hexagon has the same chair. Every chair is warm."
    - "I asked the stacks for #book_name#. Something on a high shelf moved."
    - "The stairs between galleries spiral, and I no longer believe they go anywhere new."
    - "The dust has a direction. It drifts toward the lower galleries."
    - "A slip of paper fell from #book_name#. It said '#margin#' in my hand."
    - "There is a smell of #smell# in the reading room."
  rr_out: ["#stamp#", "—", "not yet", "{n:2-90} years later", "at the same moment", "§7(no entry)§0", "see next page", "#stamp#, the day before", "still reading"]
  rr_note: ["Librarian's note: the reader at desk {n:2-90} has been on the same page since #time#.", "Librarian's note: a reader asked for silence. It was already silent. It got quieter.", "Librarian's note: please do not move the chairs. They know where they go.", "Librarian's note: lamp {n:2-40} burns #colour#. Reported.", "Librarian's note: two readers signed in under the same name. Neither was that person.", "Librarian's note: #rule.lower#."]
  far_library: ["the Library of Gallery {n:2-9999}", "the Lower Stacks", "the Library across the stair", "the Hexagon of Mirrors", "the Uncatalogued Wing", "the Library that burned (and didn't)", "the Reading Room at the end of the corridor", "the Upper Galleries", "the Annex of Duplicates", "the Library of Unwritten Books"]
  ill_needed: ["Day #day#", "as soon as possible", "before I forget why", "yesterday", "the end of the aisle", "no date", "whenever it exists"]
  ill_reply: ["We hold {n:2-900} copies. They differ in one letter each. Please specify which.", "The book you have requested is on loan to you.", "Item located. Item dispatched. Item has not left the shelf.", "We cannot send this book. It is the only book holding up the shelf.", "Our copy is missing pages {n:2-90} to {n:91-400}, which are the pages you want.", "This title is not yet written. Your request has been forwarded to the author.",
              "Please collect from the courier. There is no courier.", "Request denied: you do not appear in our register. You do appear in our catalogue.", "Item found shelved in your own gallery. We are sorry for the walk."]
  ill_reader: ["I only need one sentence from it. I'll know it when I see it.", "My copy ends mid-word. I need to know the word.", "The Librarian says it exists. The Librarian says many things.", "It mentions me. I would like to know how.", "Please send any edition. Please send any book.", "I have walked to #lib# twice. Both times it was here."]
  ill_status: ["Received", "In transit ({n:2-900} years)", "Lost in the stacks", "Fulfilled. Reader not found.", "Cancelled by reader. Reader denies this.", "Pending"]
  review_open: ["I read this book in a single sitting. I am still sitting.", "It is not often one finds a book worth finishing. I have not found one yet, but this came close.", "#rvauth# has done it again, by which I mean they have written the same book again.", "This is an important book. I cannot tell you why without spoiling page {n:2-900}.", "The prose is clean. In places, the prose is too clean.", "The Librarian assigned me this book. I suspect it was assigned to me in other ways too."]
  review_body: ["The middle section is a list of hallways. It drags, but so do hallways.", "Chapter {n:2-90} is written entirely in #~word#. I am told it is moving.", "The characters are thin, and get thinner, until only their names are left.", "There is a twist on page {n:2-900}. I will only say that it is a door.", "The index is better than the book. The index knows this.", "#rvauth# writes about #room# as if they had been there. I have been there. They have not.",
                "One passage, '#~salad#', I have read {n:2-90} times. It means something different each time.", "The ending is abrupt. My copy simply stops at the edge of a shelf.", "There are long passages of #~syllabic#, which I suspect is the point.", "Readers who enjoyed #book_name# will enjoy this too. It is the same book."]
  review_verdict: ["Recommended.", "Recommended, with reservations about page {n:2-900}.", "Not recommended. Read it anyway.", "{n:1-5} stars out of {n:5-9}.", "Essential. Shelve it high.", "I will read it again. I have no choice."]
  overdue_line: ["Our records show the item has not been returned. Our records also show it is on the shelf.", "Fines accrue at one page per day. Please bring the pages.", "If you have already returned this item, please return it again.", "The Librarian has noticed.", "A reader in Gallery {n:2-999} is waiting for this item. They have waited #late# years and are very patient.",
                 "Please do not return the item to a different library. It will find its way back to you.", "Your borrowing rights are suspended. Your reading rights are not. Nothing can suspend those.", "We have sent this notice {n:2-90} times. Please confirm you exist.", "We have written to your previous address, which is this desk.", "If the item has been lost, please describe where."]
  tr_note: ["p. {n:2-400}: the word '#~word#' means both 'door' and 'the moment before a door'. I have used 'door'. I regret it.", "p. {n:2-400}: the original has no word for 'outside'. I have left a blank.", "p. {n:2-400}: '#~word#' is rendered here as '#obj#', which is wrong, but nearer than anything else.", "p. {n:2-400}: the author repeats this sentence {n:2-90} times. I have kept them all.",
            "p. {n:2-400}: in #src#, hallways are counted, not named.", "p. {n:2-400}: a line here addresses the translator directly. I have not translated it.", "p. {n:2-400}: #src# has {n:3-9} words for the hum. I have used 'hum' for all of them, and I apologise.", "p. {n:2-400}: the ink changes here. So does the hand. So, I think, does the author.", "p. {n:2-400}: '#~word#', an untranslatable word for feeling #feeling#.", "p. {n:2-400}: the original reads '#~word# #~word# #~word#'. I have left it as it is."]
  debate_a: ["This passage is plainly about the stacks.", "The author is describing a real gallery. I have stood in it.", "Read it again. The word is 'exit'.", "The text predicts the next shelf.", "Every copy says the same here.", "Clearly a later interpolation.", "The book is complete. Nothing is missing.", "This is the key to the whole catalogue.", "I have found the author in the index. It is me.", "Page {n:2-400} confirms it."]
  debate_b: ["It is about nothing. Most things are.", "You have stood in every gallery. They are all this one.", "The word is 'wall'. It has always been 'wall'.", "It predicts the previous shelf. You are reading backwards.", "Mine doesn't.", "Interpolated by whom? By you?", "Then where are pages {n:2-90} to {n:91-400}?", "There is no key. There is no lock.", "Mine too. We should talk.", "That page has been removed. By you, I assume."]
  debate_c: ["Stop writing in my books.", "They are not your books.", "Agreed.", "Disagreed.", "See my previous note.", "I moved shelves to get away from you. You are here.", "We have argued for {n:2-90} years. I no longer remember my position.", "I concede. I take it back.", "Who is the third hand?", "Still here?", "Yes."]

genres:

  # ─── Lobby: what people leave in desks ───

  journal:
    voices: [lobby, library]
    weight: 5
    decay: 0.7
    title: ["Day #day#", "Journal", "#writerfirst#'s journal", "Log (do not take)", "Notes", "Still here", "Day #day# (I think)", "Untitled", "Things I know", "Diary", "Don't read this", "#writerfirst# #writerlast#"]
    author: ["#writer#", "#writerfirst#", "Me", "??"]
    opening:
      - "Day #day#.\n\n#journal_line# #journal_line#\n\n#journal_line#"
      - "#time.cap#.\n\n#journal_line# #journal_line# #journal_line#"
      - "If found, return to #writer#, #dept#.\n\nDay #day#. #journal_line#"
      - "Day #day#. Or {n:2-999}. #journal_line#\n\n#journal_line#"
      - "#writerfirst#'s notes. Day #day#.\n\nI'm writing this so I don't forget. #journal_line#"
      - "Found this notebook in #place#. It was blank. Now it isn't.\n\n#journal_line#"
      - "Day #day#, #time#.\n\n#journal_line#\n#journal_line#\n#journal_line#"
    body:
      - "Later.\n\n#journal_line# #journal_line#"
      - "Day ??\n\n#journal_line# #journal_line# #journal_line#"
      - "#time.cap#. #journal_line#\n\n#journal_line#"
      - "Next day. #journal_line# {?40:#journal_line#} #journal_line#"
      - "I dreamed of #dream#.\n\n#journal_line#"
      - "#journal_line#\n\nThat's all for today. #journal_line#"
      - "Note to self: #rule.lower#.\n\n#journal_line#"
      - "Hours later. #journal_line# #journal_line#"
      - "Couldn't sleep. #journal_line#\n\n#journal_line#"
    body_pages: [1, 4]
    closing:
      - "#journal_line#\n\nI'm going to try #direction# at #landmark#.\n\nIf this is the last entry, #backrooms_truth#."
      - "#journal_line# #journal_line#\n\nI'll keep writing."
      - "Day #day#.\n\nSame as yesterday."
      - "#journal_line#\n\n#writerfirst#"
      - "#journal_line#\n\nI'm leaving this here for the next one. Hi."
      - "I can hear #sound# coming closer. #journal_line#\n\nMore later."
      - "Day #day#.\n\nDay #day#.\n\nDay #day#."

  memo:
    voices: [lobby, office]
    weight: 4
    decay: 0.4
    setup: "[topic:#memo_topic#]"
    title: ["Memo: RE: #topic.title#", "RE: RE: #topic.title#", "FW: #topic.title#", "Memo #num#", "URGENT: #topic.title#", "Reminder: #topic.title#", "Internal Memo", "FW: FW: FW: #topic.title#"]
    author: ["#writer#", "#dept#", "Management", "#writer#, #dept#"]
    opening:
      - "TO: All Staff\nFROM: #writer#, #dept#\nRE: #topic.cap#\n\nIt has come to our attention that #backrooms_truth#. Please keep this in mind regarding #topic#."
      - "TO: #other#\nCC: Everyone\nRE: #topic.cap#\n\nPer our conversation, #topic# is no longer our concern. #rule#."
      - "MEMO\n\nEffective immediately: #rule.lower#.\n\nThis applies to all staff on all floors, including floors not yet built."
      - "INTERNAL MEMO\nFROM: #dept#\nTO: #dept#\nRE: #topic.cap#\n\nWe have received {n:2-90} complaints about #topic#. We have filed them with the others."
      - "TO: Whoever is on shift\nRE: #topic.cap# (again)\n\nThis is the #ordinal# memo about #topic#. It will not be the last."
    body:
      - "Staff are reminded:\n\n- #rule#.\n- #rule#.\n- #rule#."
      - "Several employees have reported #sound# near #place#. This is normal. #rule#."
      - "Regarding #office_word#: progress is on track. The track is longer than expected."
      - "[d:#dept#]From #time#, #topic# will be handled by #d#. #d# has not been told."
      - "Staff are reminded not to discuss, in #place# or anywhere, the fact that #backrooms_truth#."
      - "Please stop leaving #obj.a# at #landmark#. We know it's you."
      - "The following are no longer permitted:\n- #obj.a#\n- #obj.a#\n- asking about #topic#"
    body_pages: [0, 2]
    closing:
      - "Thank you for your cooperation.\n\n#writer#\n#dept#"
      - "Questions may be directed to #place#.\n\n(Nobody is in #place#.)"
      - "This memo will self-file.\n\n- Management"
      - "Please initial below to confirm you have read this memo.\n\n#writerfirst.initial#. #writerfirst.initial#. #writerfirst.initial#."
      - "Regards,\n#writer#\n(dictated, not read)"
      - "Destroy after reading. Then read again."

  rules:
    voices: [lobby, library, office]
    weight: 3
    decay: 0.5
    title: ["RULES", "The Rules", "House Rules", "Read First", "What I Know", "Rules (revised)", "Rules (revised again)", "Rules ({n:2-9})", "For the New One"]
    author: ["#writer#", "Someone Who Stayed", "Management", "Unknown", "Whoever was here before you"]
    opening:
      - "{RULES|THE RULES|READ THIS FIRST|WHAT I KNOW|HOUSE RULES}\n\n{+r}. #rule#.\n{+r}. #rule#.\n{+r}. #rule#.\n{+r}. #rule#."
      - "If you are reading this, you are new. Learn these.\n\n{+r}. #rule#.\n{+r}. #rule#.\n{+r}. #rule#."
      - "Rules for #place#:\n\n{+r}. #rule#.\n{+r}. #rule#.\n{+r}. #rule#."
    body:
      - "{+r}. #rule#.\n{+r}. #rule#.\n{+r}. #rule#.{?50:\n{+r}. #rule#.}"
      - "{+r}. #rule#.\n{+r}. #rule#.\n{n:40-99}. #rule#.\n{+r}. #rule#."
      - "{+r}. #rule#. (#rule_aside#)\n{+r}. #rule#.\n{+r}. #rule#."
      - "{+r}. #rule#.\n{+r}. #rule#. This one matters.\n{+r}. #rule#."
    body_pages: [0, 2]
    closing:
      - "Last rule: #rule.lower#."
      - "There used to be more rules."
      - "Do not add to this list."
      - "{n:40-99}. #rule#.\n\n(I don't know who wrote that one.)"
      - "If you break one, write it here so the next person knows.\n\n#writerfirst# broke {n:1-9}."
      - "Follow the rules and you'll be fine.\n\n(You won't be fine. But you'll be here.)"

  letter:
    voices: [lobby]
    weight: 3
    decay: 0.4
    setup: "[to:#addressee#]"
    title: ["Letter to #to#", "Unsent", "For #to#", "Letter (unsent)", "Please deliver", "Dear #to#", "To #to#"]
    author: ["#writer#", "#writerfirst#", "Your #writerfirst#"]
    opening:
      - "Dear #to#,\n\n#letter_line# #letter_line#"
      - "#to.cap#,\n\nI don't know if this will reach you. #letter_line#"
      - "Dear #to#,\n\nIt's me. It's #writerfirst#. #letter_line#\n\n#letter_line#"
      - "To #to#, if this ever gets out:\n\n#letter_line#"
    body:
      - "#letter_line# #letter_line#\n\n#letter_line#"
      - "#letter_line#\n\nI dreamed of #dream#."
      - "I keep starting this letter. #letter_line#\n\n#letter_line#"
      - "Anyway. #letter_line# #letter_line#"
    body_pages: [0, 2]
    closing:
      - "#letter_line#\n\n#letter_close#,\n#writerfirst#"
      - "#letter_close#,\n#writerfirst#\n\nP.S. #rule#."
      - "I'll write again when the lights change.\n\n#letter_close#,\n#writerfirst#"
      - "#letter_line#\n\nThat's all the paper.\n#writerfirst#"

  maintenance_log:
    voices: [lobby, office]
    weight: 2
    decay: 0.5
    title: ["Maintenance Log", "Work Orders", "Facilities Log #num#", "Log — #place.title#", "Jobs", "Job Sheet"]
    author: ["#writer#", "Facilities", "Night Shift", "#writerfirst# (maint.)"]
    opening:
      - "MAINTENANCE LOG\n#place.title#\n\n#stamp# #maint_task#. #maint_result#\n#stamp# #maint_task#. #maint_result#"
      - "WORK ORDERS — #dept#\nTech: #writer#\n\n#stamp# #maint_task#. #maint_result#"
    body:
      - "#stamp# #maint_task# in #room#. #maint_result#\n#stamp# #maint_task#. #maint_result#\n#stamp# #maint_task#. #maint_result#"
      - "#stamp# #maint_task# at #landmark#. #maint_result#\n#stamp# #maint_task#. #maint_result#"
      - "#stamp# Called to #room#. #maint_task#. #maint_result#\n#stamp# Break.\n#stamp# #maint_task#. #maint_result#"
    body_pages: [1, 3]
    closing:
      - "#stamp# #maint_task#. #maint_result#\n\nEnd of shift."
      - "#stamp# Clocked out.\n#stamp# Clocked out.\n#stamp# Clocked out."
      - "#stamp# Handed over to #other#.\n\nNote for #other#: #rule.lower#."

  incident_report:
    voices: [lobby, office]
    weight: 2
    decay: 0.5
    title: ["Incident Report #num#", "Incident #{n:100-999}", "Report (Do Not File)", "Incident: #place.title#", "Unusual Occurrence"]
    author: ["#writer#", "#dept#", "Witness"]
    opening:
      - "INCIDENT REPORT\n\nLocation: #place.cap#\nTime: #time#\nReported by: #writer#\nSeverity: #severity#"
      - "INCIDENT #{n:100-999}\n#dept#\n\nWhere: #place.cap#\nWhen: #time#\nWho: #other#\nWhat: see below"
      - "REPORT OF UNUSUAL OCCURRENCE\n\nFiled by: #writer#\nDate: Day #day#\nSeverity: #severity#\nFirst report: {Yes|No|Unclear}"
    body:
      - "Description:\n#incident#"
      - "Witness statement (#other#):\n'#transcript_a#' '#transcript_b#'"
      - "Further details:\n#incident#\n\nThe lights were #light_state#. The carpet was #carpet_state#."
      - "Timeline:\n#stamp# All normal.\n#stamp# #sound.cap#.\n#stamp# #incident#"
    body_pages: [1, 2]
    closing:
      - "Action taken: #action#\n\nSigned, #writer#"
      - "Action taken: #action#\nFollow-up: #action#"
      - "Reviewed by: #other#\nOutcome: #action#\n\nThis report has been filed. It will be found again."

  directions:
    voices: [lobby, library]
    weight: 3
    decay: 0.6
    title: ["Way Out", "Directions", "How to get out", "Map (sort of)", "This way", "Don't trust this", "The Route"]
    author: ["#writer#", "Someone who left", "A friend", "Unknown"]
    opening:
      - "To get out:\n\n{+d}. #dir_step#\n{+d}. #dir_step#\n{+d}. #dir_step#"
      - "Directions from #place#, as best I remember:\n\n{+d}. #dir_step#\n{+d}. #dir_step#"
      - "Read all of this before you start.\n\n{+d}. #dir_step#\n{+d}. #dir_step#\n{+d}. #dir_step#"
    body:
      - "{+d}. #dir_step#\n{+d}. #dir_step#\n{+d}. #dir_step#"
      - "If you reach #landmark#, you went wrong. Go back to #landmark#. #dir_step#"
      - "{+d}. #dir_step#\n{+d}. #dir_step#\n\nBy now you should smell #smell#."
      - "{+d}. #dir_step#\n\nIf you see #thing#, don't stop.\n\n{+d}. #dir_step#"
    body_pages: [0, 2]
    closing:
      - "If you end up back here, start again."
      - "It worked for me.\n\n(It didn't.)"
      - "The last step changes. I'm sorry."
      - "Good luck.\n#writerfirst#"
      - "Last step: #dir_step#\n\nThen you're out. Then you're out."
      - "{+d}. You're there. Look around. Is it the same?"

  transcript:
    voices: [lobby, office]
    weight: 2
    decay: 0.6
    title: ["Transcript", "Recording #num#", "Tape {n:2-40} (partial)", "Overheard", "Side {A|B}"]
    author: ["#writer#", "Records", "Unknown"]
    opening:
      - "TRANSCRIPT (partial)\n\nA: #transcript_a#\nB: #transcript_b#\nA: #transcript_a#\nB: #transcript_b#"
      - "RECORDING #num#\nLocation: #place.cap#\n\nA: #transcript_a#\nB: #transcript_b#"
      - "[tape hiss]\n\nA: Is this on?\nB: #transcript_b#\nA: #transcript_a#\nB: #transcript_b#"
    body:
      - "A: #transcript_a#\nB: #transcript_b#\nA: #transcript_a#\nB: [{inaudible|laughter|the hum}]\nA: #transcript_a#"
      - "B: #transcript_a#\nA: #transcript_b#\nB: #transcript_a#\nA: [{long pause|static|a door}]\nB: #transcript_b#"
      - "[{n:2-40} minutes of #sound#]\n\nA: #transcript_a#\nB: #transcript_b#"
    body_pages: [0, 2]
    closing:
      - "A: #transcript_a#\nB: ...\nA: Hello?\n\n[END OF TAPE]"
      - "[recording continues for {n:2-9} hours with no speech]"
      - "A: #transcript_a#\nB: #transcript_b#\nC: #transcript_b#\n\n[there were two people in the room]"

  lost_and_found:
    voices: [lobby]
    weight: 1
    decay: 0.3
    title: ["Lost & Found", "LOST", "FOUND", "Has anyone seen", "Lost Property"]
    author: ["#writer#", "Reception"]
    opening:
      - "LOST: #obj.a# (#colour#). Last seen near #landmark#.\n\nIf found, return to #place#.\n\nREWARD: #obj.a#"
      - "FOUND: #obj.a#, near #landmark#. Has a name on it, but the name keeps changing.\n\nAsk at #place#."
      - "LOST: my #obj#. It's #colour#. It was here a minute ago.\n\n— #writerfirst#"
    body:
      - "FOUND: #obj.a#, #obj.a#, and #other#'s #obj#. Claim at #place#."
      - "ALSO LOST: #other#. Last seen walking #direction#."
      - "LOST: the way back to #room#. If you find it, write it here:\n\n________"
      - "FOUND: a pair of shoes at #landmark#, laces still tied."
      - "FOUND: #obj.a# that isn't anyone's. Unclaimed for {n:2-90} days. Still warm."
    body_pages: [0, 2]
    closing:
      - "Items unclaimed after {n:7-90} days will be returned to the walls."
      - "If you lost #obj1.a#, it's in #place#. If you didn't, it's yours now."

  form:
    voices: [lobby, office]
    weight: 2
    decay: 0.4
    title: ["Form #num#-{A|B|C}", "Application", "Exit Request", "Timesheet", "Questionnaire", "Leave Request"]
    author: ["#dept#", "HR", "#writer#"]
    opening:
      - "FORM #num#-{A|B|C}\n\nName: #form_answer#\nDepartment: #dept#\nHow long have you been here: #form_answer#\nDescribe the exit: #form_answer#"
      - "APPLICATION FOR LEAVE\n\nName: #writer#\nDates requested: #form_answer#\nDestination: #form_answer#\nReason: #form_answer#"
      - "TIMESHEET\nEmployee: #writer#\nWeek: #day#\n\nMon: {n:8-24} hrs\nTue: {n:8-24} hrs\nWed: {n:8-24} hrs\nThu: {n:24-99} hrs\nFri: (blank)"
    body:
      - "Have you seen #thing#? #form_answer#\nDo you hear the hum? #form_answer#\nDo you hear it now? #form_answer#"
      - "Reason for request:\n#form_answer#\n\nApproved by: ________\nDenied by: #other#"
      - "Section {n:2-9}: list everyone you have seen today.\n\n#fullname#, #fullname#, #thing#"
      - "Is your desk where it was? #form_answer#\nIs your chair? #form_answer#\nAre you? #form_answer#"
    body_pages: [0, 2]
    closing:
      - "Signature: #writer#\n\nPlease return to #place#. Please return to #place#. Please return."
      - "Office use only:\nReceived: #time#\nProcessed: #form_answer#\nOutcome: #action#"
      - "[d:#dept#]Return this form to #d#.\nIf #d# cannot be found, keep this form. It is yours now."

  dream_log:
    voices: [lobby, library]
    weight: 1
    decay: 0.6
    title: ["Dreams", "What I dream", "Sleep Log", "Night Notes"]
    author: ["#writer#", "#writerfirst#"]
    opening:
      - "I dreamed of #dream#.\n\nWhen I woke up the lights were #light_state#."
      - "Sleep log, Day #day#.\n\nSlept under #landmark#. Dreamed of #dream#."
      - "I've started writing my dreams down. #other# says it helps.\n\nLast night: #dream#."
    body:
      - "I dreamed of #dream#."
      - "No dream. Just #sound#."
      - "I dreamed I was writing this."
