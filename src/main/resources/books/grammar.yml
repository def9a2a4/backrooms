    body_pages: [2, 5]
    closing:
      - "Score: {n:0-20} / {n:5-20}\nResult: #quiz_result#"
      - "Thank you for completing Module #num#. Please complete Module #num# again in {n:2-30} minutes."
      - "Marked by: #other#\nResult: #quiz_result#\n\nComments: #rule#."

  birthday_card:
    voices: [office, lobby]
    weight: 2
    decay: 0.3
    setup: "[bday:#first#]"
    title: ["Happy Birthday!", "For #bday#", "Card for #bday#", "Many Happy Returns", "#bday# — HBD"]
    author: ["Everyone", "#dept#", "The Team", "All of Us"]
    opening:
      - "HAPPY BIRTHDAY, #bday.caps#!\n\n(from everyone at #dept#)"
      - "To #bday#,\n\nAnother year! Another year. Another year.\n\nLove from #dept#"
      - "Happy birthday, #bday#!\n\nYour #ordinal# birthday here, we think."
    body:
      - "'#card_msg#'\n#card_sign#\n\n'#card_msg#'\n#card_sign#"
      - "'#card_msg#'\n#card_sign#\n\n'#card_msg#'\n#card_sign#\n\n'#card_msg#'\n#card_sign#"
    body_pages: [1, 3]
    closing:
      - "(signed by {n:20-300} people. There are {n:3-19} people on the floor.)"
      - "Please pass this card on to #other#. It's #other#'s birthday too. It's everyone's birthday."
      - "'#card_msg#'\n— #bday#\n\n(the last one is in #bday#'s own handwriting)"

  # ─── Library ───

  catalogue:
    voices: [library]
    weight: 5
    decay: 0.5
    setup: "[bk:#book_name#]"
    title: ["Catalogue #shelf_mark#", "Card Index", "Accession Register", "#bk#", "Shelf List"]
    author: ["The Librarian", "Cataloguing", "#writer#"]
    opening:
      - "#bk#\n#shelf_mark#\n\n#shelf_note#\n\nSee also: #book_name#"
      - "CARD INDEX\nDrawer #shelf_mark#\n\n#bk#\n#shelf_note#\n#shelf_note#"
    body:
      - "#book_name#\n#shelf_mark#\n#shelf_note#\n\n#book_name#\n#shelf_mark#\n#shelf_note#"
      - "#book_name#\nby #~word.title# #~word.title#\n#shelf_mark#\n#shelf_note#"
      - "#book_name#\n#shelf_mark#\nsee: #bk#\n\n#book_name#\n#shelf_mark#\nsee: #bk#"
    body_pages: [1, 4]
    closing:
      - "End of drawer {n:2-900}.\nContinued in drawer {n:2-900}."
      - "#book_name#\n#shelf_mark#\n\nThis card refers to itself."
      - "Cards beyond this point are blank. Cards beyond this point are being written."

  marginalia:
    voices: [library]
    weight: 4
    decay: 0.7
    title: ["#book_name#", "#book_name# (annotated)", "A Reader's Copy"]
    author: ["#~word.title# #~word.title#", "Anonymous", "#writer#"]
    opening:
      - "#~salad.cap#\n\n§7[#margin#]§0\n\n#~salad.cap#"
      - "#library_line#\n\n§7[#margin#]§0"
      - "Chapter {n:2-90}\n\n#~salad.cap# #~salad.cap#\n\n§7[#margin#]§0"
    body:
      - "#~syllabic.cap# #~salad#\n\n§7[#margin#]§0"
      - "#library_line#\n\n§7[#margin#]§0\n\n#~salad.cap#"
      - "#~salad.cap#\n\n§7[#margin#] [#margin#]§0"
      - "#~syllabic.cap#\n\n§7[#margin# — #writerfirst#]§0"
    body_pages: [1, 4]
    closing:
      - "§7[#margin#]\n[#margin#]\n[#margin#]"
      - "§7[#margin#]§0\n\nThe rest of the margin has been cut away."

  index:
    voices: [library]
    weight: 2
    decay: 0.5
    title: ["Index", "Index (Vol. {n:2-99})", "Index of Indexes", "Concordance"]
    author: ["The Librarian", "Indexing"]
    opening:
      - "INDEX\n\n#~word.cap#, {n:2-900}\n#~word.cap#, {n:2-900}\n#room.cap#, {n:2-900}\n#~word.cap#, see #~word.cap#\nExit, see Exit"
      - "INDEX, Vol. {n:2-99}\n\nAisles, endless, {n:2-900}\n#~word.cap#, {n:2-900}\nAll books, see Book\nBook, see All books"
    body:
      - "#~word.cap#, {n:2-900}-{n:2-900}\n#obj.cap#, {n:2-900}\n#~word.cap#, passim\n#writer#, {n:2-900}\n#~word.cap#, see #~word.cap#"
      - "#book_name#, {n:2-900}\n#room.cap#, {n:2-900}, {n:2-900}\nThe Librarian, passim\n#~word.cap#, see Doors"
      - "Doors, {n:2-900}\n— false, {n:2-900}\n— warm, {n:2-900}\n— see also Walls\nWalls, see Doors"
    body_pages: [1, 3]
    closing:
      - "Yourself, {n:2-900}\nYourself, {n:2-900}\nYourself, this page"
      - "Index, {n:2-900}\nIndex, see Index"

  errata:
    voices: [library]
    weight: 1
    decay: 0.4
    title: ["Errata", "Corrections", "Erratum", "Errata (Supplement)"]
    author: ["The Publisher", "The Librarian"]
    opening:
      - "ERRATA\n\np. {n:2-400}: for '#~word#' read '#~word#'.\np. {n:2-400}: for 'exit' read 'wall'.\np. {n:2-400}: for '#writer#' read 'you'."
      - "CORRECTIONS TO #book_name.caps#\n\np. {n:2-400}, line {n:1-30}: for 'up' read 'down'.\np. {n:2-400}: delete the reader."
    body:
      - "p. {n:2-400}: the last line should not be read.\np. {n:2-400}: for 'outside' read '#~word#'."
      - "p. {n:2-400}: the author's name is misspelled throughout. It should read '#writer#'."
      - "p. {n:2-400}: for 'the shelves end' read 'the shelves do not end'.\np. {n:2-400}: for 'door' read 'door (closed)'."
    body_pages: [0, 2]
    closing:
      - "The publisher regrets any confusion. The publisher regrets."
      - "This erratum contains no errors.\n\np. 1: for 'no errors' read '{n:2-90} errors'."

  librarian_journal:
    voices: [library]
    weight: 2
    decay: 0.6
    title: ["Shelving Log", "Librarian's Day Book", "Day #day# in the stacks", "Stack Notes"]
    author: ["#writer#", "The Assistant Librarian"]
    opening:
      - "Day #day#.\n\n#library_line# #library_line#"
      - "Day #day# of shelving.\n\nReturned: {n:2-900}. Shelved: {n:2-900}. Missing: {n:2-900}.\n\n#library_line#"
      - "Shift notes, Gallery #num#.\n\n#library_line#"
    body:
      - "#library_line#\n\n#library_line# #library_line#"
      - "Later.\n\n#library_line#"
      - "Shelved #book_name#. Shelved it again an hour later, on a different shelf. #library_line#"
      - "A reader asked for #book_name#. I said we did not have it. We have {n:2-900} copies."
      - "#library_line# #library_line#\n\nThe trolley squeaks. It didn't yesterday."
    body_pages: [1, 3]
    closing:
      - "#library_line#\n\nI am going to shelve myself."
      - "#library_line#\n\nEnd of shift. There is no next shift. I'll do it anyway."

  reading_room_log:
    voices: [library]
    weight: 2
    decay: 0.5
    title: ["Reading Room Log", "Readers' Register", "Sign-in, Gallery #num#", "Reading Room {A|B|C}"]
    author: ["The Librarian", "Front Desk", "#writer#"]
    opening:
      - "READING ROOM\nGallery #num#\n\nReaders are asked to sign in and out.\n\n#stamp# #fullname#\nread: #book_name#\nout: #rr_out#"
      - "READERS' REGISTER\nPlease write legibly. Please write.\n\n#stamp# #fullname#\nread: #book_name#\nout: #rr_out#"
    body:
      - "#stamp# #fullname#\nread: #book_name#\nout: #rr_out#\n\n#stamp# #fullname#\nread: #book_name#\nout: #rr_out#"
      - "#stamp# #fullname#\nread: #book_name#\nout: #rr_out#\n\n#rr_note#"
      - "#rr_note#\n\n#stamp# #writer#\nread: #book_name#\nout: #rr_out#"
    body_pages: [1, 4]
    closing:
      - "Readers now in the room: {n:1-9}.\nReaders signed in: {n:100-9000}."
      - "#stamp# #writer#\nread: this register\nout: —"
      - "#rr_note#\n\nThe reading room closes at #time#. It has never closed."

  interlibrary_loan:
    voices: [library]
    weight: 2
    decay: 0.4
    setup: "[want:#book_name#][lib:#far_library#]"
    title: ["Interlibrary Loan", "ILL Request #num#", "Loan Request", "Request Slip"]
    author: ["#writer#", "Circulation", "The Loans Desk"]
    opening:
      - "INTERLIBRARY LOAN REQUEST\n\nTitle: #want#\nShelf: #shelf_mark#\nFrom: #lib#\nReader: #writer#\nNeeded by: #ill_needed#"
      - "REQUEST SLIP\n\nI would like to borrow #want#, held by #lib#.\n\n#writer#"
    body:
      - "Reply from #lib#:\n\n#ill_reply#"
      - "Reader's note:\n#ill_reader#"
    body_pages: [1, 3]
    closing:
      - "Status: #ill_status#\n\nCharges: none. Nothing here is ever charged."
      - "Status: #ill_status#"
      - "Status: #ill_status#\n\n§7[#margin#]§0"

  book_review:
    voices: [library]
    weight: 2
    decay: 0.45
    setup: "[rv:#book_name#][rvauth:#~word.title# #~word.title#]"
    title: ["Review: #rv#", "On #rv#", "A Review", "Notices", "Reader's Report"]
    author: ["#writer#", "A Reader", "#writerfirst#", "The Reviews Desk"]
    opening:
      - "#rv#\nby #rvauth#\n{n:100-99000} pp.\n\nReviewed by #writer#\n\n#review_open#"
      - "REVIEW\n\n#rv#, by #rvauth#.\n\n#review_open#"
    body: ["#review_body#", "#review_body#\n\n#review_body#"]
    body_pages: [1, 3]
    closing:
      - "Verdict: #review_verdict#\n\n#writer#"
      - "Verdict: #review_verdict#\n\n§7[#margin#]§0"
      - "I have shelved it in #shelf_mark#, where it belongs. Someone has moved it already."

  overdue_notice:
    voices: [library]
    weight: 2
    decay: 0.45
    setup: "[od:#book_name#][late:{n:2-900}]"
    title: ["OVERDUE", "Overdue Notice", "Final Notice", "Please Return", "Circulation Notice"]
    author: ["The Circulation Desk", "The Librarian", "Circulation"]
    opening:
      - "OVERDUE NOTICE\n\nTo: #writer#\nItem: #od#\nShelf: #shelf_mark#\nDue: Day #day#\nOverdue by: #late# years"
      - "Dear #writer#,\n\nThe item #od# is now #late# years overdue."
    body:
      - "Reminder {+od}.\n\n#overdue_line#"
      - "Reminder {+od}.\n\n#overdue_line#"
      - "#overdue_line#"
    body_pages: [1, 3]
    closing:
      - "Amount owed: {n:2-900} pages.\n\nThe Circulation Desk"
      - "This is your final notice.\n\nThis is your final notice."
      - "Item returned. Item returned by #other#. #other# has not borrowed it."

  translator_notes:
    voices: [library]
    weight: 2
    decay: 0.5
    setup: "[src:#~word.title#][tr:#book_name#]"
    title: ["Translator's Notes", "On the Translation", "A Note on the Text", "#tr# (tr.)"]
    author: ["#writer#", "The Translator", "#writer#, tr."]
    opening:
      - "A NOTE ON THE TRANSLATION\n\n#tr# was written in #src#, a language of which only this book survives. I have done my best."
      - "TRANSLATOR'S NOTES\n\nThe #src# original is longer than the shelf it sits on. This is a selection."
    body: ["#tr_note#\n\n#tr_note#", "#tr_note#", "#tr_note#"]
    body_pages: [2, 4]
    closing:
      - "Where the original is silent, I have been silent too.\n\n#writer#, translator"
      - "Any errors are mine. The others belong to the book.\n\n#writer#"
      - "I have now read #tr# more often than its author did. I am beginning to think in #src#."

  margin_debate:
    voices: [library]
    weight: 2
    decay: 0.6
    title: ["#book_name#", "A Disputed Copy", "Annotated (Heavily)", "Two Hands"]
    author: ["#~word.title# #~word.title#", "Anonymous", "Two Readers"]
    opening:
      - "#~salad.cap#\n\n§1[#debate_a#]§0\n§4[#debate_b#]§0"
      - "#library_line#\n\n§4[#debate_a#]§0\n§1[#debate_b#]§0"
    body:
      - "#~salad.cap#\n\n§1[#debate_a#]§0\n§4[#debate_b#]§0"
      - "§1[#debate_c#]§0\n§4[#debate_c#]§0\n§1[#debate_c#]§0"
      - "#~syllabic.cap#\n\n§4[#debate_b#]§0\n§1[#debate_c#]§0"
    body_pages: [1, 4]
    closing:
      - "§1[I'm leaving the last word to you.]§0\n§4[#debate_c#]§0\n§1[See? You can't stop either.]§0"
      - "§1[#debate_c#]§0\n§4[#debate_c#]§0\n§7(a third hand) #margin#§0"
