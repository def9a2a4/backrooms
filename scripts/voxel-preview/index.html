<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voxel Scan Preview</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg: #1b1d20; --fg: #e6e6e6; --muted: #9aa0a6; --panel: rgba(20, 22, 25, 0.88); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 12px 14px;
      border-radius: 8px; min-width: 240px; max-width: calc(100vw - 48px); }
    #panel h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0; }
    select, input[type=number] { width: 80px; font: inherit; background: #2a2d31; color: var(--fg); border: 1px solid #444;
      border-radius: 4px; padding: 2px 4px; }
    button { margin-top: 8px; width: 100%; padding: 6px; background: #3b5bdb; color: white; border: 0;
      border-radius: 4px; cursor: pointer; }
    #tune { margin-top: 8px; border-top: 1px solid #333; padding-top: 6px; }
    #tune h2 { font-size: 13px; margin: 0 0 4px; display: flex; justify-content: space-between; }
    #tune-status { color: var(--muted); font-weight: normal; font: 11px ui-monospace, monospace; }
    #tune input[type=range] { width: 120px; vertical-align: middle; }
    #tune-progress { width: 100%; height: 8px; accent-color: #3b5bdb; margin-bottom: 4px; }
    #tune output { display: inline-block; width: 32px; text-align: right; color: var(--muted); }
    .tune-buttons { display: flex; gap: 6px; }
    .tune-buttons button { margin-top: 4px; padding: 4px; background: #444; }
    #progress-row { margin-top: 8px; }
    #progress { width: 100%; height: 10px; accent-color: #3b5bdb; }
    .progress-line { display: flex; justify-content: space-between; align-items: center;
      color: var(--muted); font: 12px ui-monospace, monospace; }
    #cancel { width: auto; margin: 0; padding: 2px 8px; background: #444; }
    #stats { margin-top: 8px; color: var(--muted); white-space: pre; font: 12px ui-monospace, monospace; }
    #credit { position: fixed; bottom: 8px; right: 12px; color: var(--muted); font-size: 11px; }
    #credit a { color: var(--muted); }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel">
    <h1>Voxel preview</h1>
    <label>Model <select id="model" style="width: 190px"></select></label>
    <label id="size-row">Mesh size <select id="size"></select></label>
    <label>View <select id="viewmode"><option value="voxels">Voxels</option>
      <option value="mesh">Reduced mesh</option>
      <option value="colors">Colors before matching</option></select></label>
    <label>Scale <select id="scale"><option>1</option><option>2</option><option>4</option><option>6</option>
      <option>8</option><option>12</option><option>16</option></select></label>
    <label>Crop radius (blocks) <input id="radius" type="number" value="320" min="16" max="2000" step="16"></label>
    <label id="thick-row">Shell thickness <input id="thick" type="number" value="1.5" min="0.5" max="6" step="0.25"></label>
    <label>Surface materials <input id="mats" type="checkbox" checked></label>
    <label id="grid-row">Surface grid (3D texture) <input id="grid" type="checkbox" checked></label>
    <label id="fog-row">Fog <input id="fog" type="checkbox"></label>
    <label>Source mesh <input id="wire" type="checkbox"></label>
    <label>Refit camera <input id="refit" type="checkbox"></label>
    <div id="tune" style="display: none">
      <h2>Tune matching <span id="tune-status"></span></h2>
      <progress id="tune-progress" max="1" value="0" style="display: none"></progress>
      <label>Blur <span><input id="t-blur" type="range" min="0" max="16" step="0.5"><output id="o-blur"></output></span></label>
      <label>Contrast <span><input id="t-spread" type="range" min="0.2" max="1.6" step="0.05"><output id="o-spread"></output></span></label>
      <label>Texture match <span><input id="t-pattern" type="range" min="0" max="3" step="0.1"><output id="o-pattern"></output></span></label>
      <label>Majority filter <span><input id="t-majority" type="range" min="0" max="3" step="1"><output id="o-majority"></output></span></label>
      <label>Height shading <span><input id="t-height" type="range" min="-1" max="1" step="0.05"><output id="o-height"></output></span></label>
      <label>Slope shading <span><input id="t-slope" type="range" min="-1" max="1" step="0.05"><output id="o-slope"></output></span></label>
      <label>Brightness <span><input id="t-brightness" type="range" min="-1" max="1" step="0.05"><output id="o-brightness"></output></span></label>
      <div class="tune-buttons"><button id="t-reset">Reset</button><button id="t-copy">Copy settings</button></div>
    </div>
    <button id="build">Voxelize</button>
    <div id="progress-row" style="display: none">
      <progress id="progress" max="1" value="0"></progress>
      <div class="progress-line"><span id="progress-label"></span><button id="cancel">Cancel</button></div>
    </div>
    <div id="stats">loading…</div>
  </div>
  <div id="credit"></div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
