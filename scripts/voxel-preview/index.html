<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stonehenge Voxel Preview</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg: #1b1d20; --fg: #e6e6e6; --muted: #9aa0a6; --panel: rgba(20, 22, 25, 0.88); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #panel { position: fixed; top: 12px; left: 12px; background: var(--panel); padding: 12px 14px;
      border-radius: 8px; min-width: 240px; max-width: calc(100vw - 48px); }
    #panel h1 { font-size: 14px; margin: 0 0 8px; }
    label { display: flex; justify-content: space-between; gap: 12px; margin: 4px 0; }
    select, input[type=number] { width: 80px; background: #2a2d31; color: var(--fg); border: 1px solid #444;
      border-radius: 4px; padding: 2px 4px; }
    button { margin-top: 8px; width: 100%; padding: 6px; background: #3b5bdb; color: white; border: 0;
      border-radius: 4px; cursor: pointer; }
    #stats { margin-top: 8px; color: var(--muted); white-space: pre; font: 12px ui-monospace, monospace; }
    #credit { position: fixed; bottom: 8px; right: 12px; color: var(--muted); font-size: 11px; }
    #credit a { color: var(--muted); }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="panel">
    <h1>Level 56 voxel preview</h1>
    <label>Scale <select id="scale"><option>4</option><option>8</option><option selected>16</option></select></label>
    <label>Radius (blocks) <input id="radius" type="number" value="320" min="32" max="1200" step="16"></label>
    <label>Fog <input id="fog" type="checkbox"></label>
    <label>Source mesh <input id="wire" type="checkbox"></label>
    <button id="build">Voxelize</button>
    <div id="stats">loading…</div>
  </div>
  <div id="credit">
    "<a href="https://sketchfab.com/3d-models/stonehenge-england-vr-7e7febabef2045a68755cc39c8c7c91f">Stonehenge England - VR</a>"
    by Graphic solutions, CC BY 4.0. Decimated and voxelized.
  </div>
  <script type="module" src="./preview.js"></script>
</body>
</html>
